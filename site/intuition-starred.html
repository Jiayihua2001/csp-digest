<script>
const DATA={"blind-test-6:0": {"statement": "Benchmark lattice-energy methods achieve only ~3-4 kJ/mol accuracy for absolute lattice energies (best quantum-chemical benzene calc ~1 kJ/mol), yet polymorph energy differences that must be resolved are far smaller, so successful rankings often rely on fortuitous error cancellation.", "scope": "vdW-inclusive DFT and quantum-chemical lattice-energy methods applied to organic molecular crystals", "evidence": "'benchmark studies... suggest accuracies of 3-4 kJ/mol for absolute lattice energies, while one of the most sophisticated quantum-chemical calculations of the lattice energy of benzene is accurate to only 1 kJ/mol... accuracies of lattice-energy differences therefore may still involve fortuitous cancellation of errors'", "generality": "established", "type": "statistic", "title": "Report on the sixth blind test of organic crystal structure prediction methods", "year": 2016, "url": "https://doi.org/10.1107/s2052520616007447"}, "blind-test-6:1": {"statement": "CSP success has two distinct requirements: (1) the experimental structure must correspond to a local minimum of the fitness function so it is GENERATED, and (2) it must be RANKED highly. Structures can be generated by the search but discarded during intermediate ranking before reaching accurate final ranking, causing failures unrelated to search coverage.", "scope": "all CSP workflows with hierarchical generate-then-rank pipelines", "evidence": "'Experimental structures were initially generated by some search algorithms but not ranked highly by the intermediate optimisation and ranking methods, and therefore not brought forward to the final stages where these missing structures could have ranked highly.'", "generality": "established", "type": "principle", "title": "Report on the sixth blind test of organic crystal structure prediction methods", "year": 2016, "url": "https://doi.org/10.1107/s2052520616007447"}, "blind-test-6:2": {"statement": "Conformers that appear unstable or are saddle points for the isolated molecule in vacuo can be the ones adopted in the stable crystal; some may not even correspond to a gas-phase minimum. Rigid searches using gas-phase-favored conformers systematically miss experimental structures (seen acutely for XXVI, the largest/flexible target).", "scope": "flexible molecules with multiple accessible conformations in CSP", "evidence": "'conformers that appear unstable for the molecule in vacuo can be found in the stable crystal structure... in some cases the solid-state conformation may not even correspond to a conformer on the isolated molecule's potential-energy surface'; XXVI failures 'attributed to difficulties in generating the experimental conformation due to its distorted nature'", "generality": "established", "type": "pitfall", "title": "Report on the sixth blind test of organic crystal structure prediction methods", "year": 2016, "url": "https://doi.org/10.1107/s2052520616007447"}, "blind-test-6:3": {"statement": "Force fields and even some vdW-DFT approximations can mispredict molecular conformation: for target XXII many methods flattened the hinged dithiino ring (a saddle point), traced to poor treatment of S atoms with some dispersion approaches, seeding wrong crystal structures even in fully ab initio submissions.", "scope": "molecules with soft internal degrees of freedom / heavy-atom vdW (S) treatment", "evidence": "'Some force fields fail to adequately represent the hinge of this molecule... Even some DFT methods have difficulty with the conformation... traced back to issues treating the S atoms with some vdW approaches... a number of submissions, even fully ab initio ones, featured crystal structures with flat or nearly flat molecules'", "generality": "single-study", "type": "pitfall", "title": "Report on the sixth blind test of organic crystal structure prediction methods", "year": 2016, "url": "https://doi.org/10.1107/s2052520616007447"}, "blind-test-6:4": {"statement": "Finite-temperature free energies (harmonic Helmholtz Fvib) change polymorph rank order and repeatedly IMPROVED the ranking of experimental structures; use them when energy gaps between competitors are small. Free-energy/MD calculations cost >=1 order of magnitude more than the geometry optimization.", "scope": "polymorph ranking where lattice-energy gaps are small (e.g. XXII, XXIII)", "evidence": "'The second lists of Day et al., Price et al. and Tkatchenko et al. all employed Helmholtz free energies, which changed the rank order... and, in all three cases, improved the ranking of the experimentally known structure'; 'the cost of all of these calculations is substantial, often more than an order of magnitude more than the initial geometry optimisation'", "generality": "suggested", "type": "decision_rule", "title": "Report on the sixth blind test of organic crystal structure prediction methods", "year": 2016, "url": "https://doi.org/10.1107/s2052520616007447"}, "blind-test-6:5": {"statement": "0 K equilibrium geometries inflate RMSD vs experiment because they omit thermal expansion and zero-point motion. For XXII an MD simulation at the true 150 K experimental temperature gave RMSD20 = 0.140 A, smaller than any submitted static structure; a 300 K MD gave 0.187 A.", "scope": "comparing predicted 0 K structures to finite-temperature diffraction structures", "evidence": "'For XXII, MD simulations at 300 K gave an RMSD20 of 0.187 A... but a post-test MD simulation at the experimental temperature of 150 K, gives a value of 0.140 A, which is smaller than the RMSD values for the submitted structures. This demonstrates the significant contribution of thermal and zero-point motion to RMSDs.'", "generality": "single-study", "type": "pitfall", "title": "Report on the sixth blind test of organic crystal structure prediction methods", "year": 2016, "url": "https://doi.org/10.1107/s2052520616007447"}, "blind-test-6:6": {"statement": "Salt vs co-crystal is a fine and sometimes unresolvable line: target XXV, announced as a co-crystal, was later found proton-disordered (O occupancy 0.58, N 0.42) - a mixture of salt and co-crystal. Methods with fixed protonation states cannot explore this; only DFT-based rankings allowed barrierless proton migration to reveal salt forms.", "scope": "multi-component acid-base systems where proton position is ambiguous", "evidence": "'the hydrogen-bonding proton in XXV is disordered, making the structure a mixture of a molecular salt and a co-crystal'; 'proton occupancies of 0.58 on the carboxylic acid oxygen and 0.42 on the nitrogen'; salt prediction 'possible due to their use of DFT in the final ranking stage, which allows for proton migration... only if there is no barrier'", "generality": "single-study", "type": "pitfall", "title": "Report on the sixth blind test of organic crystal structure prediction methods", "year": 2016, "url": "https://doi.org/10.1107/s2052520616007447"}, "blind-test-6:7": {"statement": "Computational cost and success are weakly correlated: for XXII some cheap empirical-potential + rigid-multipole submissions (<200 CPU hours) succeeded while several full DFT/ab initio submissions (orders of magnitude more cost) failed. Match method complexity to the physics that actually limits the target.", "scope": "CSP method selection across target difficulty levels", "evidence": "'a few submissions predicted the known experimental structure with less than 200 CPU hours, using comparatively simple empirical potentials... Conversely, a number of full DFT/ab initio submissions for XXII failed to predict the experimental structure, despite using orders of magnitude more computational resources'", "generality": "suggested", "type": "decision_rule", "title": "Report on the sixth blind test of organic crystal structure prediction methods", "year": 2016, "url": "https://doi.org/10.1107/s2052520616007447"}, "blind-test-6:8": {"statement": "Hierarchical ranking is standard: cheap potentials or coarse DFT (e.g. Harris-approximation charge densities) triage a large pool, then progressively expensive methods (bespoke multipole/DFT-fitted potentials, then full periodic vdW-DFT like PBE+MBD, TPSS-D3, PBE+XDM) rank the survivors near the global minimum.", "scope": "modern CSP ranking workflows (2016 blind test participants)", "evidence": "'a hierarchical approach has been adopted, in which a less intensive computational method or algorithm is used initially... More computationally demanding methods and algorithms were then employed for the final set of structures closest to the global minimum'; 'Solid-state DFT calculations have been used by 12 submissions... where only two submissions employed DFT' in the fifth test", "generality": "established", "type": "pipeline_practice", "title": "Report on the sixth blind test of organic crystal structure prediction methods", "year": 2016, "url": "https://doi.org/10.1107/s2052520616007447"}, "blind-test-6:9": {"statement": "A CSP landscape densely populated with low-energy putative structures near the global minimum signals likely polymorphism and unreliable single-structure prediction; large energy gaps above the minimum signal a robust prediction. Multiple submissions independently finding the same low-energy putative structures strengthens confidence that they are real candidate forms.", "scope": "interpreting energy landscapes to guide experiment rather than predict 'the' structure", "evidence": "'For XXV, some of the submitted lists show large gaps in terms of energy... For other systems, the results show a range of structures close to the global minimum, which is more indicative of potential polymorphism'; 'many of the other structures predicted as being low in energy were found in multiple submissions'", "generality": "suggested", "type": "principle", "title": "Report on the sixth blind test of organic crystal structure prediction methods", "year": 2016, "url": "https://doi.org/10.1107/s2052520616007447"}, "gator-2018:0": {"statement": "Evolutionary niching promotes uniform sampling of the PES by evolving several subpopulations simultaneously, which helps overcome initial-pool biases and selection biases (genetic drift) that otherwise collapse a GA onto a few basins.", "scope": "GA-based molecular crystal structure prediction", "evidence": "Paper: 'Evolutionary niching promotes uniform sampling of the potential energy surface by evolving several subpopulations, which helps overcome initial pool biases and selection biases (genetic drift).'", "generality": "suggested", "type": "principle", "title": "GAtor: A First-Principles Genetic Algorithm for Molecular Crystal Structure Prediction", "year": 2018, "url": "https://doi.org/10.1021/acs.jctc.7b01152"}, "gator-2018:1": {"statement": "Clustering the dynamically updated population by structural similarity via machine learning and applying a cluster-based fitness function lets a GA reach disconnected, hard-to-reach regions of the energy landscape and locate numerous low-energy minima.", "scope": "GA molecular CSP with descriptor/ML-based similarity clustering", "evidence": "Paper: niching implemented 'by using machine learning to cluster ... population by structural similarity and then employing a cluster-based fitness function' increasing likelihood of 'locating numerous low-energy minima, including those located in disconnected, hard to reach regions.'", "generality": "single-study", "type": "principle", "title": "GAtor: A First-Principles Genetic Algorithm for Molecular Crystal Structure Prediction", "year": 2018, "url": "https://doi.org/10.1021/acs.jctc.7b01152"}, "gator-2018:2": {"statement": "GAtor performs the GA search with dispersion-inclusive DFT for local optimizations and energies, then re-relaxes and re-ranks the best generated structures with a hierarchy of increasingly accurate DFT functionals and dispersion methods.", "scope": "First-principles molecular CSP pipeline (GAtor + FHI-aims)", "evidence": "Paper: 'best structures generated are re-relaxed and re-ranked using a hierarchy of increasingly accurate DFT functionals and dispersion methods'; local optimizations/energies via FHI-aims with dispersion-inclusive DFT.", "generality": "single-study", "type": "pipeline_practice", "title": "GAtor: A First-Principles Genetic Algorithm for Molecular Crystal Structure Prediction", "year": 2018, "url": "https://doi.org/10.1021/acs.jctc.7b01152"}, "gator-2018:3": {"statement": "Breeding operators designed specifically for molecular crystals provide a deliberate balance between exploration (diversity) and exploitation (refining good structures).", "scope": "GA operators for molecular crystals", "evidence": "Paper: 'Breeding operators designed specifically for molecular crystals provide a balance between exploration and exploitation.'", "generality": "suggested", "type": "principle", "title": "GAtor: A First-Principles Genetic Algorithm for Molecular Crystal Structure Prediction", "year": 2018, "url": "https://doi.org/10.1021/acs.jctc.7b01152"}, "gator-2018:4": {"statement": "Validate a CSP method on chemically diverse targets spanning different intermolecular interaction types; GAtor was benchmarked on four past blind test targets characterized by different interaction motifs and found the experimental plus other low-energy structures for all four.", "scope": "Benchmarking molecular CSP methods against CSP blind test targets", "evidence": "Paper: 'applied to a chemically diverse set of four past blind test targets, characterized by different types of intermolecular interactions. The experimentally observed structures and other low-energy structures are found for all four targets.'", "generality": "single-study", "type": "decision_rule", "title": "GAtor: A First-Principles Genetic Algorithm for Molecular Crystal Structure Prediction", "year": 2018, "url": "https://doi.org/10.1021/acs.jctc.7b01152"}, "gator-2018:5": {"statement": "Predicted crystal energy landscapes can produce a top-ranked putative structure that is not the experimentally reported form and differs in Z' and packing motif, so the lowest-energy prediction should not be assumed to be the known experimental polymorph.", "scope": "Molecular CSP ranking; e.g. Target II 5-cyano-3-hydroxythiophene", "evidence": "Paper: for Target II the top-ranked putative structure is a Z'=2, P-1, scaffold-packing-motif structure 'which has not been reported previously.'", "generality": "single-study", "type": "pitfall", "title": "GAtor: A First-Principles Genetic Algorithm for Molecular Crystal Structure Prediction", "year": 2018, "url": "https://doi.org/10.1021/acs.jctc.7b01152"}};
window.renderStars=function(){
  const ids=(JSON.parse(localStorage.getItem('intuition_starred')||'[]')).filter(c=>DATA[c]);
  const list=document.getElementById('starlist');list.innerHTML='';
  ids.forEach(cid=>{const d=DATA[cid];const div=document.createElement('div');
    div.className='chunk';div.dataset.cid=cid;
    div.innerHTML=`<span class="cstar" title="Unstar">&#9733;</span>`+
      `<div class="stmt"></div><div class="meta"></div><div class="ev"></div><div class="src"></div>`;
    div.querySelector('.stmt').textContent=d.statement;
    div.querySelector('.meta').textContent=`${d.type} · scope: ${d.scope} · ${d.generality}`;
    div.querySelector('.ev').textContent=d.evidence;
    div.querySelector('.src').innerHTML=d.url?`source: <a href="${d.url}" target="_blank"></a>`:'source: ';
    const a=div.querySelector('.src a')||div.querySelector('.src');
    a.textContent=`${d.title} (${d.year||''})`;
    list.appendChild(div);});
  document.getElementById('emptymsg').style.display=ids.length?'none':'block';
};
document.getElementById('copystars').addEventListener('click',ev=>{
  const md=(JSON.parse(localStorage.getItem('intuition_starred')||'[]')).filter(c=>DATA[c]).map(c=>{const d=DATA[c];
    return `- **${d.statement}**\n    - scope: ${d.scope} | generality: ${d.generality}\n    - evidence: ${d.evidence}\n    - source: [${d.title} (${d.year||''})](${d.url})`;
  }).join('\n');
  navigator.clipboard.writeText(md).then(()=>{ev.target.textContent='Copied!';setTimeout(()=>ev.target.textContent='Copy as Markdown',1500);});
});
</script>
<script>
const KEY='intuition_starred';
const get=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}};
const save=a=>localStorage.setItem(KEY,JSON.stringify(a));
function paint(){
  const s=new Set(get());
  document.querySelectorAll('.chunk[data-cid]').forEach(el=>{
    const b=el.querySelector('.cstar');
    if(b){const on=s.has(el.dataset.cid);b.innerHTML=on?'&#9733;':'&#9734;';b.classList.toggle('on',on);}
  });
  const n=document.getElementById('navstarn');if(n)n.textContent=get().length;
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('.cstar');if(!b)return;
  const cid=b.closest('.chunk').dataset.cid;let a=get();
  a=a.includes(cid)?a.filter(x=>x!==cid):[...a,cid];save(a);paint();
  if(window.renderStars)window.renderStars();
});
paint();if(window.renderStars)window.renderStars();
</script></div></body></html>
