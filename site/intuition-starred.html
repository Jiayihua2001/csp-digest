<script>
const DATA={"blind-test-6:0": {"statement": "Benchmark lattice-energy methods achieve only ~3-4 kJ/mol accuracy for absolute lattice energies (best quantum-chemical benzene calc ~1 kJ/mol), yet polymorph energy differences that must be resolved are far smaller, so successful rankings often rely on fortuitous error cancellation.", "scope": "vdW-inclusive DFT and quantum-chemical lattice-energy methods applied to organic molecular crystals", "evidence": "'benchmark studies... suggest accuracies of 3-4 kJ/mol for absolute lattice energies, while one of the most sophisticated quantum-chemical calculations of the lattice energy of benzene is accurate to only 1 kJ/mol... accuracies of lattice-energy differences therefore may still involve fortuitous cancellation of errors'", "generality": "established", "type": "statistic", "title": "Report on the sixth blind test of organic crystal structure prediction methods", "year": 2016, "url": "https://doi.org/10.1107/s2052520616007447"}, "blind-test-6:1": {"statement": "CSP success has two distinct requirements: (1) the experimental structure must correspond to a local minimum of the fitness function so it is GENERATED, and (2) it must be RANKED highly. Structures can be generated by the search but discarded during intermediate ranking before reaching accurate final ranking, causing failures unrelated to search coverage.", "scope": "all CSP workflows with hierarchical generate-then-rank pipelines", "evidence": "'Experimental structures were initially generated by some search algorithms but not ranked highly by the intermediate optimisation and ranking methods, and therefore not brought forward to the final stages where these missing structures could have ranked highly.'", "generality": "established", "type": "principle", "title": "Report on the sixth blind test of organic crystal structure prediction methods", "year": 2016, "url": "https://doi.org/10.1107/s2052520616007447"}, "blind-test-6:2": {"statement": "Conformers that appear unstable or are saddle points for the isolated molecule in vacuo can be the ones adopted in the stable crystal; some may not even correspond to a gas-phase minimum. Rigid searches using gas-phase-favored conformers systematically miss experimental structures (seen acutely for XXVI, the largest/flexible target).", "scope": "flexible molecules with multiple accessible conformations in CSP", "evidence": "'conformers that appear unstable for the molecule in vacuo can be found in the stable crystal structure... in some cases the solid-state conformation may not even correspond to a conformer on the isolated molecule's potential-energy surface'; XXVI failures 'attributed to difficulties in generating the experimental conformation due to its distorted nature'", "generality": "established", "type": "pitfall", "title": "Report on the sixth blind test of organic crystal structure prediction methods", "year": 2016, "url": "https://doi.org/10.1107/s2052520616007447"}, "blind-test-6:3": {"statement": "Force fields and even some vdW-DFT approximations can mispredict molecular conformation: for target XXII many methods flattened the hinged dithiino ring (a saddle point), traced to poor treatment of S atoms with some dispersion approaches, seeding wrong crystal structures even in fully ab initio submissions.", "scope": "molecules with soft internal degrees of freedom / heavy-atom vdW (S) treatment", "evidence": "'Some force fields fail to adequately represent the hinge of this molecule... Even some DFT methods have difficulty with the conformation... traced back to issues treating the S atoms with some vdW approaches... a number of submissions, even fully ab initio ones, featured crystal structures with flat or nearly flat molecules'", "generality": "single-study", "type": "pitfall", "title": "Report on the sixth blind test of organic crystal structure prediction methods", "year": 2016, "url": "https://doi.org/10.1107/s2052520616007447"}, "blind-test-6:4": {"statement": "Finite-temperature free energies (harmonic Helmholtz Fvib) change polymorph rank order and repeatedly IMPROVED the ranking of experimental structures; use them when energy gaps between competitors are small. Free-energy/MD calculations cost >=1 order of magnitude more than the geometry optimization.", "scope": "polymorph ranking where lattice-energy gaps are small (e.g. XXII, XXIII)", "evidence": "'The second lists of Day et al., Price et al. and Tkatchenko et al. all employed Helmholtz free energies, which changed the rank order... and, in all three cases, improved the ranking of the experimentally known structure'; 'the cost of all of these calculations is substantial, often more than an order of magnitude more than the initial geometry optimisation'", "generality": "suggested", "type": "decision_rule", "title": "Report on the sixth blind test of organic crystal structure prediction methods", "year": 2016, "url": "https://doi.org/10.1107/s2052520616007447"}, "blind-test-6:5": {"statement": "0 K equilibrium geometries inflate RMSD vs experiment because they omit thermal expansion and zero-point motion. For XXII an MD simulation at the true 150 K experimental temperature gave RMSD20 = 0.140 A, smaller than any submitted static structure; a 300 K MD gave 0.187 A.", "scope": "comparing predicted 0 K structures to finite-temperature diffraction structures", "evidence": "'For XXII, MD simulations at 300 K gave an RMSD20 of 0.187 A... but a post-test MD simulation at the experimental temperature of 150 K, gives a value of 0.140 A, which is smaller than the RMSD values for the submitted structures. This demonstrates the significant contribution of thermal and zero-point motion to RMSDs.'", "generality": "single-study", "type": "pitfall", "title": "Report on the sixth blind test of organic crystal structure prediction methods", "year": 2016, "url": "https://doi.org/10.1107/s2052520616007447"}, "blind-test-6:6": {"statement": "Salt vs co-crystal is a fine and sometimes unresolvable line: target XXV, announced as a co-crystal, was later found proton-disordered (O occupancy 0.58, N 0.42) - a mixture of salt and co-crystal. Methods with fixed protonation states cannot explore this; only DFT-based rankings allowed barrierless proton migration to reveal salt forms.", "scope": "multi-component acid-base systems where proton position is ambiguous", "evidence": "'the hydrogen-bonding proton in XXV is disordered, making the structure a mixture of a molecular salt and a co-crystal'; 'proton occupancies of 0.58 on the carboxylic acid oxygen and 0.42 on the nitrogen'; salt prediction 'possible due to their use of DFT in the final ranking stage, which allows for proton migration... only if there is no barrier'", "generality": "single-study", "type": "pitfall", "title": "Report on the sixth blind test of organic crystal structure prediction methods", "year": 2016, "url": "https://doi.org/10.1107/s2052520616007447"}, "blind-test-6:7": {"statement": "Computational cost and success are weakly correlated: for XXII some cheap empirical-potential + rigid-multipole submissions (<200 CPU hours) succeeded while several full DFT/ab initio submissions (orders of magnitude more cost) failed. Match method complexity to the physics that actually limits the target.", "scope": "CSP method selection across target difficulty levels", "evidence": "'a few submissions predicted the known experimental structure with less than 200 CPU hours, using comparatively simple empirical potentials... Conversely, a number of full DFT/ab initio submissions for XXII failed to predict the experimental structure, despite using orders of magnitude more computational resources'", "generality": "suggested", "type": "decision_rule", "title": "Report on the sixth blind test of organic crystal structure prediction methods", "year": 2016, "url": "https://doi.org/10.1107/s2052520616007447"}, "blind-test-6:8": {"statement": "Hierarchical ranking is standard: cheap potentials or coarse DFT (e.g. Harris-approximation charge densities) triage a large pool, then progressively expensive methods (bespoke multipole/DFT-fitted potentials, then full periodic vdW-DFT like PBE+MBD, TPSS-D3, PBE+XDM) rank the survivors near the global minimum.", "scope": "modern CSP ranking workflows (2016 blind test participants)", "evidence": "'a hierarchical approach has been adopted, in which a less intensive computational method or algorithm is used initially... More computationally demanding methods and algorithms were then employed for the final set of structures closest to the global minimum'; 'Solid-state DFT calculations have been used by 12 submissions... where only two submissions employed DFT' in the fifth test", "generality": "established", "type": "pipeline_practice", "title": "Report on the sixth blind test of organic crystal structure prediction methods", "year": 2016, "url": "https://doi.org/10.1107/s2052520616007447"}, "blind-test-6:9": {"statement": "A CSP landscape densely populated with low-energy putative structures near the global minimum signals likely polymorphism and unreliable single-structure prediction; large energy gaps above the minimum signal a robust prediction. Multiple submissions independently finding the same low-energy putative structures strengthens confidence that they are real candidate forms.", "scope": "interpreting energy landscapes to guide experiment rather than predict 'the' structure", "evidence": "'For XXV, some of the submitted lists show large gaps in terms of energy... For other systems, the results show a range of structures close to the global minimum, which is more indicative of potential polymorphism'; 'many of the other structures predicted as being low in energy were found in multiple submissions'", "generality": "suggested", "type": "principle", "title": "Report on the sixth blind test of organic crystal structure prediction methods", "year": 2016, "url": "https://doi.org/10.1107/s2052520616007447"}, "gator-2018:0": {"statement": "Evolutionary niching promotes uniform sampling of the PES by evolving several subpopulations simultaneously, which helps overcome initial-pool biases and selection biases (genetic drift) that otherwise collapse a GA onto a few basins.", "scope": "GA-based molecular crystal structure prediction", "evidence": "Paper: 'Evolutionary niching promotes uniform sampling of the potential energy surface by evolving several subpopulations, which helps overcome initial pool biases and selection biases (genetic drift).'", "generality": "suggested", "type": "principle", "title": "GAtor: A First-Principles Genetic Algorithm for Molecular Crystal Structure Prediction", "year": 2018, "url": "https://doi.org/10.1021/acs.jctc.7b01152"}, "gator-2018:1": {"statement": "Clustering the dynamically updated population by structural similarity via machine learning and applying a cluster-based fitness function lets a GA reach disconnected, hard-to-reach regions of the energy landscape and locate numerous low-energy minima.", "scope": "GA molecular CSP with descriptor/ML-based similarity clustering", "evidence": "Paper: niching implemented 'by using machine learning to cluster ... population by structural similarity and then employing a cluster-based fitness function' increasing likelihood of 'locating numerous low-energy minima, including those located in disconnected, hard to reach regions.'", "generality": "single-study", "type": "principle", "title": "GAtor: A First-Principles Genetic Algorithm for Molecular Crystal Structure Prediction", "year": 2018, "url": "https://doi.org/10.1021/acs.jctc.7b01152"}, "gator-2018:2": {"statement": "GAtor performs the GA search with dispersion-inclusive DFT for local optimizations and energies, then re-relaxes and re-ranks the best generated structures with a hierarchy of increasingly accurate DFT functionals and dispersion methods.", "scope": "First-principles molecular CSP pipeline (GAtor + FHI-aims)", "evidence": "Paper: 'best structures generated are re-relaxed and re-ranked using a hierarchy of increasingly accurate DFT functionals and dispersion methods'; local optimizations/energies via FHI-aims with dispersion-inclusive DFT.", "generality": "single-study", "type": "pipeline_practice", "title": "GAtor: A First-Principles Genetic Algorithm for Molecular Crystal Structure Prediction", "year": 2018, "url": "https://doi.org/10.1021/acs.jctc.7b01152"}, "gator-2018:3": {"statement": "Breeding operators designed specifically for molecular crystals provide a deliberate balance between exploration (diversity) and exploitation (refining good structures).", "scope": "GA operators for molecular crystals", "evidence": "Paper: 'Breeding operators designed specifically for molecular crystals provide a balance between exploration and exploitation.'", "generality": "suggested", "type": "principle", "title": "GAtor: A First-Principles Genetic Algorithm for Molecular Crystal Structure Prediction", "year": 2018, "url": "https://doi.org/10.1021/acs.jctc.7b01152"}, "gator-2018:4": {"statement": "Validate a CSP method on chemically diverse targets spanning different intermolecular interaction types; GAtor was benchmarked on four past blind test targets characterized by different interaction motifs and found the experimental plus other low-energy structures for all four.", "scope": "Benchmarking molecular CSP methods against CSP blind test targets", "evidence": "Paper: 'applied to a chemically diverse set of four past blind test targets, characterized by different types of intermolecular interactions. The experimentally observed structures and other low-energy structures are found for all four targets.'", "generality": "single-study", "type": "decision_rule", "title": "GAtor: A First-Principles Genetic Algorithm for Molecular Crystal Structure Prediction", "year": 2018, "url": "https://doi.org/10.1021/acs.jctc.7b01152"}, "gator-2018:5": {"statement": "Predicted crystal energy landscapes can produce a top-ranked putative structure that is not the experimentally reported form and differs in Z' and packing motif, so the lowest-energy prediction should not be assumed to be the known experimental polymorph.", "scope": "Molecular CSP ranking; e.g. Target II 5-cyano-3-hydroxythiophene", "evidence": "Paper: for Target II the top-ranked putative structure is a Z'=2, P-1, scaffold-packing-motif structure 'which has not been reported previously.'", "generality": "single-study", "type": "pitfall", "title": "GAtor: A First-Principles Genetic Algorithm for Molecular Crystal Structure Prediction", "year": 2018, "url": "https://doi.org/10.1021/acs.jctc.7b01152"}, "genarris-1:0": {"statement": "The Harris approximation (superposition of self-consistent single-molecule densities, energy evaluated without a self-consistency cycle) is accurate for weakly interacting molecules but fails when densities overlap; because it is non-variational, its binding-energy error is always negative and grows asymptotically as molecules get closer.", "scope": "Rigid molecular crystals/dimers of small organics in the van der Waals regime; PBE+TS@Harris", "evidence": "HA 'becomes exact when the molecules are far apart'; near equilibrium |dBE| small (0.0740, 0.0049, 0.0288 eV for targets II, XIII, XXII); 'Because of the non-variational nature of the HA, dBE(x) is always negative and its magnitude increases asymptotically with decreasing distance.'", "generality": "suggested", "type": "principle", "title": "Genarris: Random generation of molecular crystal structures and fast screening with a Harris approximation", "year": 2018, "url": "https://doi.org/10.1063/1.5014038"}, "genarris-1:1": {"statement": "Harris-approximation binding energies and rankings agree remarkably well with self-consistent PBE+TS for randomly generated crystal pools, with r^2 for binding energies of 0.946-0.994 and for rankings 0.976-0.989 across close-contact settings.", "scope": "2000-structure P21/n pools of Target XXII (nitrile-containing molecule), Z=4/Z'=1, sr = 0.500/0.625/0.750", "evidence": "r^2 for BEs = 0.946, 0.960, 0.994 for sr=0.500, 0.625, 0.750; r^2 for rankings = 0.976, 0.989, 0.979; optimal at sr=0.625.", "generality": "single-study", "type": "statistic", "title": "Genarris: Random generation of molecular crystal structures and fast screening with a Harris approximation", "year": 2018, "url": "https://doi.org/10.1063/1.5014038"}, "genarris-1:2": {"statement": "Set the close-contact cutoff (sr, fraction of summed vdW radii) in an intermediate window: too small admits unphysically close contacts that produce large negative HA errors, too large makes structures energetically too similar for the HA to resolve. An sr around 0.8-0.9 (or ~0.625 tuned) balances physicality against HA reliability and motif diversity.", "scope": "HA-screened random pools of rigid small organics", "evidence": "sr 'should be large enough to avoid unphysical structures... and small enough to allow for a diversity of crystal packing motifs'; default half-normal sr with bounds 0.9/0.05/0.8; sr=0.500 outliers had N...N contacts of 1.64, 1.80, 1.56 A; sr=0.750 pool too close in energy for HA to resolve.", "generality": "single-study", "type": "decision_rule", "title": "Genarris: Random generation of molecular crystal structures and fast screening with a Harris approximation", "year": 2018, "url": "https://doi.org/10.1063/1.5014038"}, "genarris-1:3": {"statement": "A descriptor based on relative positions and orientations of neighboring molecules (RCD) captures crystal packing motifs (correlating with space-group symmetry) better than atom-distance descriptors like the RDF, which instead track unit-cell volume; RCD also better identifies pre-relaxation near-duplicates.", "scope": "Rigid molecule crystals; comparison on 5000-structure raw pool of Target II", "evidence": "RCD shows 'stronger correlation with space group symmetry' and 'weaker correlation with the unit cell volume' than RDF; RCD-AP 'grouped almost all the duplicate pairs together up to 7 clusters'; RCD consistently higher silhouette scores, increasing with cluster number while RDF's decrease.", "generality": "single-study", "type": "principle", "title": "Genarris: Random generation of molecular crystal structures and fast screening with a Harris approximation", "year": 2018, "url": "https://doi.org/10.1063/1.5014038"}, "genarris-1:4": {"statement": "Affinity propagation clustering resolves small, isolated, under-sampled regions of configuration space as distinct clusters (unlike k-means which merges satellite regions), and does so deterministically without a preset cluster count. This corrects sampling bias against rarely-generated packing motifs.", "scope": "Clustering of crystal-structure pools / synthetic 2D-3D test data", "evidence": "'While k-means groups three of the satellite regions together into one cluster, AP successfully identifies them as distinct clusters'; AP identified a distinct low-a cluster containing structures within 0.2 eV of the global minimum; AP 'does not depend on a randomized initialization'.", "generality": "suggested", "type": "principle", "title": "Genarris: Random generation of molecular crystal structures and fast screening with a Harris approximation", "year": 2018, "url": "https://doi.org/10.1063/1.5014038"}, "genarris-1:5": {"statement": "Genarris workflows apply hierarchical screening: generate a large raw pool (5,000-10,000), evaluate energies (HA for Diverse/Energy, self-consistent DFT for Rigorous), then alternate RCD-AP clustering with energy-based selection, reducing to ~1% final pool and fully relaxing only at the end. Diverse selects cluster exemplars for maximal spread; Energy over-clusters to concentrate on low-energy basins; Rigorous iterates cluster/select/partial-relax down to 5% then energy-selects.", "scope": "Genarris Diverse/Energy/Rigorous workflows for rigid molecules, Z=4/Z'=1", "evidence": "Raw pools of 5,000 (II, XIII) and 10,000 (XXII); 'each step of the Diverse and Energy workflows reduces the pool to 10%'; final pool 1% of raw; Rigorous repeats until pool <5%, then purely energy-based selection to 1%; full relaxation only for final pools.", "generality": "single-study", "type": "pipeline_practice", "title": "Genarris: Random generation of molecular crystal structures and fast screening with a Harris approximation", "year": 2018, "url": "https://doi.org/10.1063/1.5014038"}, "genarris-1:6": {"statement": "To seed a genetic algorithm, prefer a maximally diverse initial population over a low-energy one: the Diverse pool gave the best GA convergence to representative low-energy motifs and consistently found the experimental structures, while Energy-seeded runs were inconsistent and Random-seeded runs performed worst.", "scope": "GAtor genetic-algorithm runs on Targets II, XIII, XXII from Genarris pools", "evidence": "'starting the GA from the Diverse pool results in the best performance... consistently find the experimental structures'; Energy pool 'leads to inconsistent performance'; Random pools 'consistently exhibit the worse performance'. 'We recommend using the Diverse workflow of Genarris to produce initial pools for GAtor.'", "generality": "single-study", "type": "decision_rule", "title": "Genarris: Random generation of molecular crystal structures and fast screening with a Harris approximation", "year": 2018, "url": "https://doi.org/10.1063/1.5014038"}, "genarris-1:7": {"statement": "Energy-selective screening over-samples low-energy basins, increasing the chance that similar structures relax into the same minimum (more post-relaxation duplicates) and leaving high-energy but distinct packing motifs under-sampled; the HA's largest ranking errors also occur precisely in the low-energy region that energy selection emphasizes, degrading r^2 step-to-step.", "scope": "HA-ranked energy-selective workflows for rigid small organics", "evidence": "Energy workflow 'tends to yield a higher number of duplicates' (e.g., 26 and 28 dup pairs for II and XXII); 'Energy and Rigorous workflows under-sample or completely miss certain clusters... tend to be higher in energy'; 'In the Energy workflow r^2 deteriorates significantly... where the errors of the HA are most severe.'", "generality": "single-study", "type": "pitfall", "title": "Genarris: Random generation of molecular crystal structures and fast screening with a Harris approximation", "year": 2018, "url": "https://doi.org/10.1063/1.5014038"}, "genarris-1:8": {"statement": "van der Waals-dominated molecular crystals have many near-degenerate local minima, so accurate polymorph ranking demands energy resolution of a few meV; dispersion-inclusive DFT (especially many-body dispersion with hybrid functionals) is the de facto standard for final ranking, while generic force fields perform poorly.", "scope": "Molecular crystal structure prediction generally (CSP blind tests)", "evidence": "'weak van der Waals interactions... lead to many local minima that are extremely close in energy, requiring energy resolution of a few meV'; 'Generic force fields have consistently been demonstrated to produce poor results'; MBD with hybrid functionals 'shown to be highly accurate'.", "generality": "established", "type": "principle", "title": "Genarris: Random generation of molecular crystal structures and fast screening with a Harris approximation", "year": 2018, "url": "https://doi.org/10.1063/1.5014038"}, "genarris-2:0": {"statement": "Solid-form volume (density) of a molecule varies across polymorphs with a standard deviation of ~2.95% - this sets a floor on how accurately any volume-estimation model can predict a specific polymorph's cell.", "scope": "Homomolecular organic crystals at room temperature/standard pressure; 2,173 unique polymorph pairs from the 2017 CSD", "evidence": "'The distribution has a standard deviation of 2.95% with respect to the solid form volume of the molecule... places a lower bound on the expected accuracy of estimated solid form molecular volumes.'", "generality": "established", "type": "statistic", "title": "Genarris 2.0: A random structure generator for molecular crystals", "year": 2020, "url": "https://doi.org/10.1016/j.cpc.2020.107170"}, "genarris-2:1": {"statement": "A raw van der Waals sphere Monte Carlo volume underestimates true solid-form volume by a factor of ~1.47; a plain linear correction gives ~4.72% error, but adding topological-fragment features reduces error to ~2.93%, matching the polymorph density spread.", "scope": "Chemically diverse CSD dataset, molecules 5-260 atoms spanning H,C,N,O, halogens, B,P,S,Si,Te,Se", "evidence": "'the ratio... was found to be 1.47... standard deviation of 4.72% error... the fragment based model achieves an error of similar magnitude to the volume differences between polymorphs... sigma = 2.93%'", "generality": "single-study", "type": "statistic", "title": "Genarris 2.0: A random structure generator for molecular crystals", "year": 2020, "url": "https://doi.org/10.1016/j.cpc.2020.107170"}, "genarris-2:2": {"statement": "About 70% of molecular crystals have molecules on general Wyckoff positions; the rest sit on special positions, most commonly two-fold axes (2), mirror planes (m), and inversion centers (bar-1).", "scope": "CSD-wide analysis of molecular crystals (Pidcock et al.)", "evidence": "'in 70.1% of the molecular crystals, molecules occupy general positions, and in the remaining structures molecules occupy special positions. Among the special positions, two-fold rotation (2), mirror planes (m), and inversion centers are the most frequent.'", "generality": "established", "type": "statistic", "title": "Genarris 2.0: A random structure generator for molecular crystals", "year": 2020, "url": "https://doi.org/10.1016/j.cpc.2020.107170"}, "genarris-2:3": {"statement": "Standard vdW cutoffs (0.85 x sum-of-radii) wrongly reject structures with strong X-H...Y hydrogen bonds because real H-bond contact distances are much shorter than typical vdW contacts; N/O donor-acceptor pairs need dedicated shorter cutoffs (effective sr ~0.55-0.62), while C-donor and halogen H-bonds are fine at 0.85.", "scope": "Homomolecular crystals with O-H/N-H donors to O/N acceptors; cutoffs from CSD IsoStar distributions", "evidence": "'the sum of the vdW radii multiplied by the default sr value of 0.85... exceeds a large number of non-bonded interaction distances... Using the default sr value, structures with strong hydrogen bonds, such as glycine, would be deemed unphysical'; Table 2 gives sr 0.55-0.62 for OH/NH...O/N.", "generality": "established", "type": "principle", "title": "Genarris 2.0: A random structure generator for molecular crystals", "year": 2020, "url": "https://doi.org/10.1016/j.cpc.2020.107170"}, "genarris-2:4": {"statement": "The generation loop is: estimate solid-form volume (relax single molecule + ML model) -> find compatible space groups within a symmetry tolerance -> per space group draw a cell volume from a Gaussian (mean = predicted volume, sigma = 3x prediction error) -> build random cell, place/orient molecule (random for general positions, axis-aligned for special positions) -> apply symmetry ops -> hierarchical distance checks -> add passing structures to raw pool.", "scope": "Genarris 2.0 raw-pool generation for semi-rigid molecules with no rotatable bonds", "evidence": "'A random volume is drawn from a Gaussian distribution whose mean and standard deviation are the predicted volume and three times the prediction error... The space group symmetry operations are then applied... The attempted structures that pass the intermolecular distance checks... are added to the raw pool.'", "generality": "single-study", "type": "pipeline_practice", "title": "Genarris 2.0: A random structure generator for molecular crystals", "year": 2020, "url": "https://doi.org/10.1016/j.cpc.2020.107170"}, "genarris-2:5": {"statement": "Structure checking is done in three escalating stages to control the O(N^2) cost: Stage I ignores periodicity and uses center-of-mass/molecule-length screening (kills most bad structures cheaply), Stage II does approximate minimum-image distances in fractional coordinates after lattice reduction, and Stage III applies a rigorous sphere-decoder closest-vector solution only for the few non-orthogonal structures that survive.", "scope": "Genarris 2.0 close-contact detection, including triclinic/oblique cells", "evidence": "'Genarris 2.0 performs a series of three hierarchical structure checks. Failed structures are discarded at each stage... most of the unphysical structures generated are rejected at this stage [I]... only few non-orthogonal structures that pass Stage I and Stage II reach Stage III. Hence, the overall efficiency is not compromised.'", "generality": "single-study", "type": "pipeline_practice", "title": "Genarris 2.0: A random structure generator for molecular crystals", "year": 2020, "url": "https://doi.org/10.1016/j.cpc.2020.107170"}, "genarris-2:6": {"statement": "Space groups with glide planes and screw axes are easier to populate than those with mirror planes, because mirror-related molecules can overlap with their own mirror image; this biases which space groups are readily sampled even when a uniform distribution is targeted.", "scope": "Random generation of rigid molecular crystals; illustrated for benzene Z=4 and glycine Z=4", "evidence": "'space groups like P2/m (10), Pmm2 (25), and Pmmm (47) which have mirror planes are harder to generate as molecules that touch the planes overlap with their own mirror image. In contrast, space groups with glide planes and screws axes are easier to generate because symmetry-equivalent molecules are translated in space.'", "generality": "suggested", "type": "principle", "title": "Genarris 2.0: A random structure generator for molecular crystals", "year": 2020, "url": "https://doi.org/10.1016/j.cpc.2020.107170"}, "genarris-2:7": {"statement": "Volume models trained on ambient-pressure CSD structures systematically over-predict cell volumes for high-pressure polymorphs; expect the predicted volume to be far from experiment when the target forms under pressure.", "scope": "Benzene high-pressure Z=2 (P2_1/c) polymorph at 25 kbar vs ambient-trained model", "evidence": "'Our prediction for Z = 4 is much closer to the experimental volume than for Z = 2 because the latter forms under pressure of 25 kbar whereas the volume estimation model was trained on structures obtained under ambient pressure.'", "generality": "single-study", "type": "pitfall", "title": "Genarris 2.0: A random structure generator for molecular crystals", "year": 2020, "url": "https://doi.org/10.1016/j.cpc.2020.107170"}, "genarris-2:8": {"statement": "Unconstrained relaxation of pool structures can break or create symmetry, changing the apparent space group, Z, or Z', so the space group of a raw structure is not a reliable label for the relaxed structure.", "scope": "DFT geometry optimization (PBE+TS, no lattice constraints) of glycine/benzene pools", "evidence": "'Relaxation of the final pool may break existing symmetries or create new ones as there are no constraints imposed. This resulted in additional space groups with a different Z or Z'. For example, space group Cmc2_1 (36) and space group P1 were created after geometry optimization for glycine with Z = 2.'", "generality": "single-study", "type": "pitfall", "title": "Genarris 2.0: A random structure generator for molecular crystals", "year": 2020, "url": "https://doi.org/10.1016/j.cpc.2020.107170"}, "genarris-2:9": {"statement": "Use the Robust down-selection workflow (RCD or RDF descriptor -> affinity-propagation cluster to ~10% -> single-point PBE+TS energies -> AP cluster again to ~10% keeping lowest-energy per cluster -> full relaxation) to produce a small, diverse, low-energy initial population rather than to guarantee finding the experimental structure.", "scope": "Genarris 2.0 curated-pool generation feeding downstream search (e.g., genetic algorithms)", "evidence": "'the goal of the Robust workflow is not necessarily to find the experimental structure but to produce an initial population for a structure search algorithm, such as a genetic algorithm.' Default cluster count is 10% of the pool; workflow uses AP clustering then energy-based selection then relaxation.", "generality": "single-study", "type": "decision_rule", "title": "Genarris 2.0: A random structure generator for molecular crystals", "year": 2020, "url": "https://doi.org/10.1016/j.cpc.2020.107170"}, "genarris-3:0": {"statement": "Energy differences between molecular crystal polymorphs are usually only a few kJ/mol, which is what demands high-accuracy ranking methods.", "scope": "Molecular crystal polymorphs in general (CSP context)", "evidence": "'the energy differences between polymorphs are usually only a few kJ/mol, requiring high accuracy.' In results, aspirin Form II vs Form I differ by 0.69 kJ/mol (PBE+MBD, 0 K); putative EM structures lie 2.69 kJ/mol (CL-20) and 1.69 kJ/mol (DNI) above experimental forms.", "generality": "established", "type": "statistic", "title": "Genarris 3.0: Generating Close-Packed Molecular Crystal Structures with Rigid Press", "year": 2025, "url": "https://doi.org/10.1021/acs.jctc.5c01080"}, "genarris-3:1": {"statement": "A regularized hard-sphere potential can drive close packing purely geometrically: freezing internal molecular geometry and optimizing lattice vectors, molecular positions and orientations to minimize cell volume subject to intermolecular distance penalties reproduces near-experimental unit cell volumes without any energy evaluation.", "scope": "Rigid, single-conformer molecules, Z'=1, all space groups; demonstrated on 6 targets including H-bonded, van der Waals, and energetic crystals", "evidence": "Rigid Press minimizes F(s)=V(s)+P_contact(s) with piecewise differentiable penalty; after Rigid Press, cell volumes are close to experimental (slightly underestimated for aspirin/Target XXII/Target I; very close for dense delta-HMX and DNI). Matches to experiment appear for all targets only after Rigid Press.", "generality": "single-study", "type": "principle", "title": "Genarris 3.0: Generating Close-Packed Molecular Crystal Structures with Rigid Press", "year": 2025, "url": "https://doi.org/10.1021/acs.jctc.5c01080"}, "genarris-3:2": {"statement": "Pre-optimize randomly generated structures with Rigid Press before MLIP/DFT relaxation: it costs up to 2 orders of magnitude less than MLIP relaxation and sharply reduces the number of downstream relaxation steps, and for some targets a match to the experimental structure is only found when Rigid Press is used.", "scope": "CSP workflows relaxing thousands to millions of putative structures", "evidence": "'The computational cost of Rigid Press optimization is lower by up to 2 orders of magnitude than relaxation using MLIPs.' For epsilon-CL-20, a match to experiment can only be found with Rigid Press (SI). SI Fig S1 shows Rigid Press pre-optimization reduces MACE-OFF relaxation steps.", "generality": "single-study", "type": "decision_rule", "title": "Genarris 3.0: Generating Close-Packed Molecular Crystal Structures with Rigid Press", "year": 2025, "url": "https://doi.org/10.1021/acs.jctc.5c01080"}, "genarris-3:3": {"statement": "The Genarris 3.0 CSP down-selection pipeline runs: generate ~4000 structures per compatible space group at 1.5x inflated volume -> Rigid Press compression -> loose-tolerance duplicate removal per space group -> MACE-OFF SPE + affinity-propagation clustering to 10% -> MACE-OFF full relaxation + duplicate removal -> AP cluster to 100, keep up to 5 within 10 kJ/mol per cluster -> PBE+MBD SPE + AP cluster (keep all within 10 kJ/mol) -> final PBE+MBD relaxation + duplicate removal.", "scope": "Genarris 3.0 CSP workflow, Z'=1; thresholds are user-tunable", "evidence": "Detailed workflow in Methods: s_r=0.95 proximity check for generation, Rigid Press default s_r=0.85, StructureMatcher tolerances 0.5/0.5/10deg; AP clustering to 10% then 100 clusters; 10 kJ/mol windows; PBE+MBD final relaxation Tier 2 tight, 3x3x3 k-grid.", "generality": "single-study", "type": "pipeline_practice", "title": "Genarris 3.0: Generating Close-Packed Molecular Crystal Structures with Rigid Press", "year": 2025, "url": "https://doi.org/10.1021/acs.jctc.5c01080"}, "genarris-3:4": {"statement": "When selecting survivors from clusters in a hierarchical CSP workflow, keep multiple low-energy structures per cluster (e.g., up to 5 within a 10 kJ/mol window) rather than only the single lowest-energy structure, because an inaccurate MLIP can rank the true structure poorly and a strict energy cutoff would discard it.", "scope": "Hierarchical CSP with general-purpose MLIP early-stage ranking, especially chemistries far from training data (energetic materials)", "evidence": "For DNI the experimental structure is ranked #79 (19.3 kJ/mol above min) by MACE-OFF but becomes the global minimum at PBE+MBD SPE; it survives because it is 2nd in its cluster and up-to-5-within-10-kJ/mol selection is used. Procedure especially benefits delta-HMX and epsilon-CL-20.", "generality": "single-study", "type": "decision_rule", "title": "Genarris 3.0: Generating Close-Packed Molecular Crystal Structures with Rigid Press", "year": 2025, "url": "https://doi.org/10.1021/acs.jctc.5c01080"}, "genarris-3:5": {"statement": "General-purpose MLIPs (MACE-OFF23(L)) give strongly chemistry-dependent accuracy: excellent for drug-like molecules (aspirin, Target I) but markedly worse for chemistries underrepresented in training (Target XXII and especially energetic materials with nitrogen-rich groups), degrading both geometry relaxation and energy ranking.", "scope": "MACE-OFF23(L) trained on SPICE 1.0 (drug-like molecules); molecular crystal relaxation and ranking vs PBE+MBD", "evidence": "Relaxation match rates (RMSD30<1A): aspirin 86.6%, Target I 91.0%, Target XXII 80.2%, epsilon-CL-20 73.7%, delta-HMX 61.8%, DNI 56.9%. Ranking MAE/RMSE: <5 kJ/mol and Kendall >0.7 for aspirin/Target I; 9-13 kJ/mol and Kendall 0.5-0.6 for Target XXII/CL-20/DNI; >20 kJ/mol and Kendall <0.4 for delta-HMX. Experimental structure misranked as #12 (HMX), #8 (CL-20), #19 (DNI) by MACE-OFF.", "generality": "single-study", "type": "pitfall", "title": "Genarris 3.0: Generating Close-Packed Molecular Crystal Structures with Rigid Press", "year": 2025, "url": "https://doi.org/10.1021/acs.jctc.5c01080"}, "genarris-3:6": {"statement": "Dispersion-inclusive DFT remains indispensable for final ranking; validate general-purpose MLIP performance per system, and if inadequate, train a system-specific potential (e.g., AIMNet2) rather than trusting out-of-the-box MLIP energies.", "scope": "CSP energy ranking; especially chemistries far from MLIP training data", "evidence": "A system-specific AIMNet2 for CL-20 gives higher match rate, lower RMSD30, lower energy MAE and higher Kendall vs PBE+MBD than MACE-OFF, ranking the experimental structure #4 at 2.50 kJ/mol above minimum. Authors 'suggest exercising caution' and recommend case-by-case validation.", "generality": "single-study", "type": "decision_rule", "title": "Genarris 3.0: Generating Close-Packed Molecular Crystal Structures with Rigid Press", "year": 2025, "url": "https://doi.org/10.1021/acs.jctc.5c01080"}, "genarris-3:7": {"statement": "Highly constrained (high-symmetry) space groups reduce the configurational degrees of freedom, making the correct structure easier to generate randomly, but also produce more symmetry-equivalent duplicates; a large fraction of duplicates signals exhaustive sampling of that space group.", "scope": "Random structure generation across space groups with special Wyckoff positions, Z'=1", "evidence": "delta-HMX (P6_1) yielded 268/52,573 matches at initial generation vs 0-1 for other targets; after generation duplicate removal reduces pools by factors of 5-20 (largest 19-20 for Target I and delta-HMX). High-symmetry/centered groups (e.g., Cm, Nos. 75-81) generate more duplicates.", "generality": "single-study", "type": "principle", "title": "Genarris 3.0: Generating Close-Packed Molecular Crystal Structures with Rigid Press", "year": 2025, "url": "https://doi.org/10.1021/acs.jctc.5c01080"}, "genarris-3:8": {"statement": "Relative stability of near-degenerate polymorphs can invert between 0 K lattice energy and finite-temperature free energy, so finite-temperature (e.g., QHA) corrections are needed when two forms are within ~1 kJ/mol.", "scope": "Near-degenerate polymorphs (aspirin Forms I and II), dispersion-inclusive DFT", "evidence": "PBE+MBD at 0 K ranks Form II below Form I by 0.69 kJ/mol, but PBE+MBD QHA free energy at 300 K predicts Form I more stable than Form II by 1.10 kJ/mol, consistent with experiment; prior studies note relative stability depends on method and free-energy corrections.", "generality": "single-study", "type": "decision_rule", "title": "Genarris 3.0: Generating Close-Packed Molecular Crystal Structures with Rigid Press", "year": 2025, "url": "https://doi.org/10.1021/acs.jctc.5c01080"}, "hoja-pbe0-mbd-2019:0": {"statement": "Reliable polymorph ranking requires relative (free) energies converged to roughly 1 kJ/mol per molecule, and coexisting/experimentally observed polymorphs typically span only a few kJ/mol.", "scope": "Molecular crystal polymorphs including flexible, salt, and cocrystal systems from the sixth CCDC blind test", "evidence": "Paper: 'need for relative (free) energies to within ~1 kJ/mol per molecule'; for XXIII all five experimental forms fall within top 4.3 kJ/mol (~1 kcal/mol) and within a 3 kJ/mol interval, 'within the expected energy range associated with coexisting polymorphs'.", "generality": "established", "type": "statistic", "title": "Reliable and practical computational description of molecular crystal polymorphs", "year": 2019, "url": "https://doi.org/10.1126/sciadv.aau3338"}, "hoja-pbe0-mbd-2019:1": {"statement": "Three physical effects are each individually necessary for quantitative rankings: hybrid exchange (Pauli repulsion / reduced self-interaction error), beyond-pairwise many-body dispersion, and vibrational (entropic) free energy; which one dominates is system-dependent.", "scope": "Diverse molecular crystals (rigid, flexible, salt, cocrystal), PBE0+MBD+Fvib framework", "evidence": "'all of the three previously mentioned theoretical effects are required'; Pauli exchange 'plays a crucial role for system XXII, while MBD effects are the most important factor for system XXVI'; harmonic Fvib has 'by far the largest impact' for XXIII and XXV.", "generality": "suggested", "type": "principle", "title": "Reliable and practical computational description of molecular crystal polymorphs", "year": 2019, "url": "https://doi.org/10.1126/sciadv.aau3338"}, "hoja-pbe0-mbd-2019:2": {"statement": "The recommended final-refinement pipeline: (1) take top ~100 sampled structures per system, (2) full PBE+TS geometry/lattice relaxation without symmetry constraints + duplicate removal, (3) PBE+MBD tight-settings relative energies, (4) PBE0+MBD static lattice energies (approximated via light-level hybrid correction added to tight PBE+MBD), (5) add PBE+TS harmonic vibrational free energies at the experimental temperature.", "scope": "Final-stage ranking of a limited structure set (~100-500 structures) after external sampling; not a from-scratch search method", "evidence": "Materials and Methods describe exactly this order; 'this computational procedure is intended for the final stability ranking of a molecular CSP using a limited structure set'; total 501 structures, 15-992 atoms.", "generality": "single-study", "type": "pipeline_practice", "title": "Reliable and practical computational description of molecular crystal polymorphs", "year": 2019, "url": "https://doi.org/10.1126/sciadv.aau3338"}, "hoja-pbe0-mbd-2019:3": {"statement": "Compute expensive PBE0+MBD and vibrational free energies only for the low-energy window, not all structures: hybrid energies for structures within ~4.5 kJ/mol of the PBE+MBD ranking and Fvib for structures within ~3 kJ/mol of the PBE0+MBD ranking.", "scope": "Cost-constrained final ranking of molecular crystals", "evidence": "'PBE0 + MBD calculations are available for (at least) the structures located within the top 4.5 kJ/mol'; 'Vibrational free energies were calculated for (at least) all structures that are located within the top 3 kJ/mol according to the PBE0 + MBD ranking'.", "generality": "single-study", "type": "decision_rule", "title": "Reliable and practical computational description of molecular crystal polymorphs", "year": 2019, "url": "https://doi.org/10.1126/sciadv.aau3338"}, "hoja-pbe0-mbd-2019:4": {"statement": "Vibrational free energies dominate the compute cost: a single PBE0+MBD point ranges ~3.5 CPU-h (15 atoms) to ~750 CPU-h (896 atoms), while harmonic Fvib ranges 180 to 45,000 CPU-h; adding QHA + Morse anharmonicity increases total cost by roughly 10x.", "scope": "FHI-aims all-electron calculations on 2.4-GHz Xeon E5-2680 v4 cores, unit cells 15-992 atoms", "evidence": "Reported CPU timings; QHA adds 4700 CPU-h and Morse adds 4300 CPU-h on top of 950 CPU-h for form A of XXIII, 'increase the computation time by approximately a factor of 10'.", "generality": "single-study", "type": "statistic", "title": "Reliable and practical computational description of molecular crystal polymorphs", "year": 2019, "url": "https://doi.org/10.1126/sciadv.aau3338"}, "hoja-pbe0-mbd-2019:5": {"statement": "Neglecting thermal expansion causes underestimation of 0 K unit cell volumes by ~3.6% vs 300 K experiment; the quasi-harmonic approximation (thermal pressure fit to Murnaghan EOS) recovers this to within ~1.0% on average.", "scope": "PBE+TS optimized molecular crystals (system XXIII and blind-test structures), room temperature", "evidence": "'we underestimate these unit cell volumes by 3.6% on average'; QHA 'predict room temperature unit cell volumes to within 1.0% on average'.", "generality": "single-study", "type": "statistic", "title": "Reliable and practical computational description of molecular crystal polymorphs", "year": 2019, "url": "https://doi.org/10.1126/sciadv.aau3338"}, "hoja-pbe0-mbd-2019:6": {"statement": "Thermal expansion (QHA) plus anharmonicity (Morse) shift relative stabilities modestly: max change ~1.4 kJ/mol (avg 0.4) from thermal expansion alone, and avg ~1.1 kJ/mol (max 2.9) versus harmonic-at-0K when both are included; some reordering occurs but the overall energy window is preserved.", "scope": "System XXIII (flexible molecule, 5 polymorphs) Z'=1 and Z'=2 structures", "evidence": "'largest observed change ... amounts to 1.4 kJ/mol ... but is only 0.4 kJ/mol on average'; 'changes the relative stabilities ... on average by only 1.1 kJ/mol with a maximum observed change of 2.9 kJ/mol'; anharmonicity brings all Z'=1 forms within 0.4 kJ/mol.", "generality": "single-study", "type": "statistic", "title": "Reliable and practical computational description of molecular crystal polymorphs", "year": 2019, "url": "https://doi.org/10.1126/sciadv.aau3338"}, "hoja-pbe0-mbd-2019:7": {"statement": "Thermodynamic ranking can predict an unobserved structure more stable than all known forms; the true experimental form may be kinetically favored, so a low predicted energy does not guarantee experimental realizability without considering nucleation/growth kinetics and solvent.", "scope": "Complex polymorphic landscapes with many structures in a few kJ/mol (e.g. flexible drug candidate XXIII)", "evidence": "Str. N70 is ~1.5-3 kJ/mol more stable than any experimental form yet unobserved; 'we hypothesize that form A might be kinetically favored'; 'thermodynamics alone is insufficient for understanding polymorph crystallization'.", "generality": "single-study", "type": "pitfall", "title": "Reliable and practical computational description of molecular crystal polymorphs", "year": 2019, "url": "https://doi.org/10.1126/sciadv.aau3338"}, "hoja-pbe0-mbd-2019:8": {"statement": "For Z'>1 handling, use the sampling list that explicitly includes Z'=2 structures; missing an experimental form (XXIII form E) can happen simply because it fell just outside the energetic window used for Z'=2 candidates.", "scope": "Multi-molecule asymmetric unit (Z'=2) molecular crystals in CSP", "evidence": "'we used the list that also included Z' = 2 structures'; form E 'was located just outside the energetic window considered for the Z' = 2 structures'.", "generality": "single-study", "type": "decision_rule", "title": "Reliable and practical computational description of molecular crystal polymorphs", "year": 2019, "url": "https://doi.org/10.1126/sciadv.aau3338"}, "pyxtal-2021:0": {"statement": "About 90% of organic crystals in the CSD have Z'=1, which is why most CSP efforts restrict generation to a few common space groups with one molecule in the asymmetric unit.", "scope": "Organic molecular crystals in the Cambridge Structure Database", "evidence": "'While 90% of organic crystals in the Cambridge Structure Database (CSD) have Z'=1' and 'most organic crystals tend to crystallize in only a few space groups with Z' = 1'", "generality": "established", "type": "statistic", "title": "PyXtal: A Python library for crystal structure generation and symmetry analysis", "year": 2020, "url": "https://doi.org/10.1016/j.cpc.2020.107810"}, "pyxtal-2021:1": {"statement": "Starting global optimization from already-symmetric trial structures finds the global energy minimum in fewer attempts than purely random generation, because symmetry biases sampling toward realistic, higher-symmetry configurations that nature prefers.", "scope": "Global optimization / CSP for atomic clusters and crystals", "evidence": "'It is generally believed that by beginning with already-symmetric structures, fewer attempts are needed to find the global energy minimum'; benchmarks show symmetric seeding found ground states while random did not.", "generality": "established", "type": "principle", "title": "PyXtal: A Python library for crystal structure generation and symmetry analysis", "year": 2020, "url": "https://doi.org/10.1016/j.cpc.2020.107810"}, "pyxtal-2021:2": {"statement": "For Lennard-Jones clusters, pre-symmetrized starting structures found the ground state 278/10000 (N=38), 73/10000 (N=55), and 1/10000 (N=75) times, while non-symmetric random starts found it zero times in all three sizes.", "scope": "LJ clusters of size 38, 55, 75; 10000 structures each, CG local optimization", "evidence": "'With pre-symmetrization, the ground state was found 278 times for size 38 clusters, 73 times for size 55, and 1 time for size 75. Without pre-symmetrization, the ground state was not found at all.'", "generality": "single-study", "type": "statistic", "title": "PyXtal: A Python library for crystal structure generation and symmetry analysis", "year": 2020, "url": "https://doi.org/10.1016/j.cpc.2020.107810"}, "pyxtal-2021:3": {"statement": "Pre-symmetrization spans structure space more broadly (higher average energy, more diverse) whereas purely random structures cluster tightly around a narrow 'glassy' energy range, especially for larger systems.", "scope": "LJ clusters and elemental C/Si crystals (2-16 atoms/cell)", "evidence": "'pre-symmetrization spans the possible structure space more effectively, while purely random structures are more clustered around a specific energy range' and 'prevent the clustering of glassy structures found in pure random generations for large systems'", "generality": "suggested", "type": "principle", "title": "PyXtal: A Python library for crystal structure generation and symmetry analysis", "year": 2020, "url": "https://doi.org/10.1016/j.cpc.2020.107810"}, "pyxtal-2021:4": {"statement": "A molecule can only occupy a Wyckoff position if its point group contains the site symmetry as a subgroup AND it is oriented so its symmetry axes align with the site symmetry axes; orientation and shape (not just position) determine WP compatibility for molecules.", "scope": "Molecular crystals, molecules on special Wyckoff positions", "evidence": "'if the object is instead a molecule, then the WP compatibility is also determined by orientation and shape' and the requirement to be 'sufficiently symmetric' and 'oriented such that its symmetry operations are aligned with the Wyckoff site symmetry'", "generality": "established", "type": "principle", "title": "PyXtal: A Python library for crystal structure generation and symmetry analysis", "year": 2020, "url": "https://doi.org/10.1016/j.cpc.2020.107810"}, "pyxtal-2021:5": {"statement": "PyXtal's generation pipeline runs in order: check Wyckoff compatibility with stoichiometry, generate lattice, insert Wyckoff positions from largest (general) to smallest multiplicity, merge close atoms into special positions, then distance-check; each step retries up to a max before failing.", "scope": "Random symmetric structure generation, atomic and molecular", "evidence": "Flowchart: 'Wyckoff Compatibility Check, Lattice Generation, Wyckoff Position Insertion, Wyckoff Merging, Distance Check' and 'PyXtal starts with the largest available WP... in order of descending multiplicity'", "generality": "single-study", "type": "pipeline_practice", "title": "PyXtal: A Python library for crystal structure generation and symmetry analysis", "year": 2020, "url": "https://doi.org/10.1016/j.cpc.2020.107810"}, "pyxtal-2021:6": {"statement": "By default do not generate crystals containing mirror (inverted) copies of chiral molecules, since a chiral molecule's mirror image can have different chemical/biological properties; enable inversion only when appropriate.", "scope": "Molecular crystals of chiral molecules, especially pharmaceutical applications", "evidence": "'a chiral molecule's mirror image will possess different chemical or biological properties... By default, PyXtal does not generate crystals with mirror copies of chiral molecules. The user can choose to allow inversion if desired.'", "generality": "established", "type": "decision_rule", "title": "PyXtal: A Python library for crystal structure generation and symmetry analysis", "year": 2020, "url": "https://doi.org/10.1016/j.cpc.2020.107810"}, "pyxtal-2021:7": {"statement": "Modeling molecules as spheres for intermolecular distance checks (center-center only) fails for anisotropic molecules like benzene, which can overlap under some rotations even when centers are far apart; direct atom-atom checking is needed and is the dominant cost for molecular crystal generation.", "scope": "Molecular crystal generation with non-spherical molecules", "evidence": "'a spherical model works poorly for irregularly shaped molecules like benzene... short separations along the perpendicular axis, but must be further apart along the planar axes' and 'this is typically the largest time cost for generation of molecular crystals'", "generality": "established", "type": "pitfall", "title": "PyXtal: A Python library for crystal structure generation and symmetry analysis", "year": 2020, "url": "https://doi.org/10.1016/j.cpc.2020.107810"}, "pyxtal-2021:8": {"statement": "To generate new candidate structures while preserving symmetry, perturb only the asymmetric unit (free WP coordinates, molecular orientation along allowed axes, flexible dihedrals, and symmetry-constrained cell); to model phase transitions or diversify, use group-subgroup (translationengleiche/klassengleiche) transitions with Wyckoff splitting and cell transformation.", "scope": "Symmetry-constrained structure modulation for CSP and phase-transition studies", "evidence": "'perturb only the atoms in the asymmetric unit... the whole molecule can be reoriented along the allowed rotational axes. If the molecule has flexible rotors, additional perturbation on these dihedral angles' and group-subgroup transition 'randomly pick one possible transformation path between G and H'", "generality": "suggested", "type": "decision_rule", "title": "PyXtal: A Python library for crystal structure generation and symmetry analysis", "year": 2020, "url": "https://doi.org/10.1016/j.cpc.2020.107810"}, "fastcsp:0": {"statement": "Competing polymorphs are typically separated by only a few kJ/mol; all 74 experimental polymorphs in the benchmark fall within 9 kJ/mol of the predicted global minimum, and single-polymorph experimental structures lie within 5 kJ/mol (vast majority within 2 kJ/mol).", "scope": "28 semi-rigid + 10 flexible organic molecules, Z'<=1, ambient (plus a few high-pressure) polymorphs", "evidence": "'Different polymorphs are often separated by only a few kJ/mol per molecule'; 'All experimentally observed polymorphs fall within 9 kJ/mol of the predicted global minimum'; 'all experimentally observed structures fall within 5 kJ/mol... with the vast majority within 2 kJ/mol'", "generality": "established", "type": "statistic", "title": "FastCSP: Accelerated Molecular Crystal Structure Prediction with Universal Model for Atoms", "year": 2025, "url": "https://doi.org/10.48550/arxiv.2508.02641"}, "fastcsp:1": {"statement": "Apply an OMC->OMol (intramolecular) conformer energy correction when the experimental structure differs from the GGA global minimum primarily by molecular conformation - i.e., for conformational polymorphs where GGA delocalization error overstabilizes planar/conjugated conformers; it is not beneficial (and can hurt) for rigid molecules or when intermolecular interactions dominate.", "scope": "Flexible molecules with conformational polymorphism (ROY, Target X, Target XXII); ineffective for semi-rigid molecules and worsened Target XVIII", "evidence": "Conformer correction lifted ROY's Y form from rank #336 to #1 and recovered Y > YT04 > R ordering; improved Target X from #5 to #1 and Target XXII to #1; 'no appreciable benefit for the semi-rigid compounds'; worsened Target XVIII from #1 to #22", "generality": "suggested", "type": "decision_rule", "title": "FastCSP: Accelerated Molecular Crystal Structure Prediction with Universal Model for Atoms", "year": 2025, "url": "https://doi.org/10.48550/arxiv.2508.02641"}, "fastcsp:2": {"statement": "GGA/semi-local functionals (PBE) suffer delocalization error that overstabilizes extended pi-conjugation, artificially lowering the energy of flatter (small-dihedral) molecular conformations and biasing the ranking of conformational polymorphs; this bias propagates doubly because planar conformers also pack more favorably. A pretrained MLIP faithfully reproduces this same error since it is trained on GGA data.", "scope": "Conformationally flexible molecules with rotatable bonds connecting conjugated systems (ROY S-C-N-C torsion, Target X amide-ring conjugation)", "evidence": "'Semi-local functionals... overstabilize extended pi-conjugation, artificially lowering the energy of molecular conformations with smaller (more planar)... dihedral angles'; UMA-OMC torsion scan 'closely tracks B86bPBE-XDM', overstabilizing planar minimum by ~4 kJ/mol vs CCSD(T)", "generality": "established", "type": "principle", "title": "FastCSP: Accelerated Molecular Crystal Structure Prediction with Universal Model for Atoms", "year": 2025, "url": "https://doi.org/10.48550/arxiv.2508.02641"}, "fastcsp:3": {"statement": "Quasi-harmonic free-energy corrections at finite temperature are NOT universally beneficial: they tend to improve recall for flexible molecules but slightly worsen it for semi-rigid molecules, and do not reliably fix polymorph ordering. Do not assume adding QHA free energies improves rankings.", "scope": "Molecular crystal polymorph ranking at 300 K via QHA; benchmark of 38 organic molecules", "evidence": "'for the semi-rigid compounds the free energy corrections make the recall slightly worse'; 'for flexible compounds... overall improvement in recall'; 'free energy corrections did not necessarily improve the stability ranking among polymorphs' - mirroring blind test 7 findings", "generality": "established", "type": "decision_rule", "title": "FastCSP: Accelerated Molecular Crystal Structure Prediction with Universal Model for Atoms", "year": 2025, "url": "https://doi.org/10.48550/arxiv.2508.02641"}, "fastcsp:4": {"statement": "The FastCSP pipeline order is: (1) RDKit multi-sampler conformer generation + UMA-OMol relaxation + Butina clustering with energy gate; (2) Genarris 3 random crystal generation across compatible space groups/Z with Rigid Press close-packing; (3) StructureMatcher deduplication (removes ~67% semi-rigid, ~43% flexible); (4) full UMA-OMC relaxation + second deduplication; (5) rank by lattice energy; optional QHA free energy and OMC->OMol conformer corrections.", "scope": "End-to-end MLIP-driven CSP workflow, Z'<=1", "evidence": "Figure 1 and Methods: conformer generation -> Genarris random generation + Rigid Press + dedup -> UMA-OMC relaxation + dedup -> ranking, with optional free energy and conformer corrections; 'an average of 67% for the Semi-Rigid and 43% for the Flexible molecules' removed at first dedup", "generality": "single-study", "type": "pipeline_practice", "title": "FastCSP: Accelerated Molecular Crystal Structure Prediction with Universal Model for Atoms", "year": 2025, "url": "https://doi.org/10.48550/arxiv.2508.02641"}, "fastcsp:5": {"statement": "Relative-energy error metrics are highly sensitive to the reference choice when the MLIP and DFT predict DIFFERENT global minima. Referencing each method to its own minimum can hide large disagreements; using a common (DFT) reference exposes them.", "scope": "Systems where UMA and PBE-D3 global minima differ (ROY, Target I, Target XVI, imidazole, nicotinamide, etc.)", "evidence": "For ROY, MAE is 0.94 kJ/mol when each method uses its own global minimum but jumps to 7.26 kJ/mol when the PBE-D3 minimum is the common reference", "generality": "suggested", "type": "pitfall", "title": "FastCSP: Accelerated Molecular Crystal Structure Prediction with Universal Model for Atoms", "year": 2025, "url": "https://doi.org/10.48550/arxiv.2508.02641"}, "fastcsp:6": {"statement": "Universal MLIPs degrade for chemistry underrepresented in training data: molecules with rare functional groups or scaffolds (diazo/diazide-carbonyl in Target XVI, aryl-CF2-SO2 linker in Target XXXI) show the worst energy MAE (2.32 and 1.96 kJ/mol) and lowest rank correlations, because the underrepresented group forms the structural core determining packing.", "scope": "OMC25-trained UMA on molecular crystals with functional groups <0.1% of training set", "evidence": "'molecules with diazo functional groups comprise <0.1% of the training set of the OMC25 dataset'; Target XVI worst-case MAE 2.32 kJ/mol, Spearman 0.51; the 'underrepresented chemistry constitutes the structural core'", "generality": "single-study", "type": "pitfall", "title": "FastCSP: Accelerated Molecular Crystal Structure Prediction with Universal Model for Atoms", "year": 2025, "url": "https://doi.org/10.48550/arxiv.2508.02641"}, "fastcsp:7": {"statement": "A single MLIP relaxation step is ~5,600x cheaper (CPU-core-h per GPU-h) than a corresponding dispersion-inclusive DFT ionic step, and an initial DFT single-point ~22,000x. Reproducing the ~2.3M-structure campaign with DFT would need ~1.6e9 CPU-core-h (192,000 CPU-core-years) vs ~1e5 GPU-h for the MLIP.", "scope": "UMA-Small v1.1 on V100 vs VASP 6.3 PBE-D3, molecular crystal relaxations", "evidence": "'each MLIP relaxation step is on average ~5,600x... cheaper than a corresponding dispersion-inclusive DFT ionic step'; 'Reproducing the same trajectories with DFT would require... a combined 1.6e9 CPU-core-h'", "generality": "single-study", "type": "statistic", "title": "FastCSP: Accelerated Molecular Crystal Structure Prediction with Universal Model for Atoms", "year": 2025, "url": "https://doi.org/10.48550/arxiv.2508.02641"}, "fastcsp:8": {"statement": "Seeding CSP with a conformer that matches the crystal geometry neither guarantees nor is strictly required for recovering the experimental structure, because intermolecular packing forces ultimately reshape the molecular conformation during relaxation; a somewhat-different initial conformer can still relax into the correct crystal. A pool of ~20 conformers (fewer than 10 usually suffices) gives comfortable coverage.", "scope": "Flexible molecules up to 4 rotatable bonds; conformer pools from RDKit + UMA-OMol", "evidence": "'seeding the workflow with conformers that match the crystal geometry does not, in and of itself, guarantee successful CSP because intermolecular interactions ultimately determine the final relaxed molecular structure'; highest-ranked conformer needed was rank #17; 'fewer than 10 conformers would have sufficed for most systems'", "generality": "suggested", "type": "principle", "title": "FastCSP: Accelerated Molecular Crystal Structure Prediction with Universal Model for Atoms", "year": 2025, "url": "https://doi.org/10.48550/arxiv.2508.02641"}, "blind-test-1:0": {"statement": "Lattice-energy CSP typically finds many candidate structures packed within only a few kJ/mol of the global minimum.", "scope": "Small organic molecules from the first CCDC blind test (four compounds, force-field lattice-energy methods)", "evidence": "'many structures are found within a few kJ mol(-1) of the global minimum'", "generality": "established", "type": "statistic", "title": "A test of crystal structure prediction of small organic molecules", "year": 2000, "url": "https://doi.org/10.1107/s0108768100004584"}, "blind-test-1:1": {"statement": "Because candidates are energetically dense near the minimum, the fine detail of force-field methodology and parametrization determines which structure ranks first, so ranking is not robust.", "scope": "Force-field lattice-energy CSP of small organics", "evidence": "'The fine detail of the force-field methodology and parametrization influences the energy ranking within each method.'", "generality": "established", "type": "pitfall", "title": "A test of crystal structure prediction of small organic molecules", "year": 2000, "url": "https://doi.org/10.1107/s0108768100004584"}, "blind-test-1:2": {"statement": "Across 11 participants proposing up to 3 structures each for 4 compounds, only 7 proposed structures were classified as 'correct' and no program was consistently reliable.", "scope": "1999 CCDC blind test, four small organic compounds", "evidence": "'11 participants...at most three structures for each compound...seven proposed structures were close to an experimental one and were classified as correct...No program gave consistently reliable results.'", "generality": "single-study", "type": "statistic", "title": "A test of crystal structure prediction of small organic molecules", "year": 2000, "url": "https://doi.org/10.1107/s0108768100004584"}, "blind-test-1:3": {"statement": "Polymorphism is a major failure mode: for a compound with two known polymorphs, only one form was predicted correctly.", "scope": "One compound in the 1999 blind test with two observed polymorphs", "evidence": "'One compound occurred in two polymorphs, but only one form was predicted correctly among the calculated structures.'", "generality": "single-study", "type": "pitfall", "title": "A test of crystal structure prediction of small organic molecules", "year": 2000, "url": "https://doi.org/10.1107/s0108768100004584"}, "blind-test-1:4": {"statement": "CSP methods are best framed as generators of a plausible set of candidate polymorphs rather than definitive predictors of the observed structure.", "scope": "Lattice-energy CSP of small organics circa 2000", "evidence": "'present methods may be useful in providing a set of structures as possible polymorphs for a given molecular structure.'", "generality": "established", "type": "principle", "title": "A test of crystal structure prediction of small organic molecules", "year": 2000, "url": "https://doi.org/10.1107/s0108768100004584"}, "blind-test-1:5": {"statement": "The blind-test protocol gives predictors only the atomic connectivity and limits them to a small number of ranked candidate structures per compound.", "scope": "CCDC blind test format", "evidence": "'given only the atomic connectivity...allowed to propose at most three structures for each compound.'", "generality": "established", "type": "pipeline_practice", "title": "A test of crystal structure prediction of small organic molecules", "year": 2000, "url": "https://doi.org/10.1107/s0108768100004584"}, "blind-test-2:0": {"statement": "In a blind test of three molecules, correct predictions among ~17 participants were only 2 for molecule 1, 4 for molecule 2, and 0 for the torsionally flexible molecule 3.", "scope": "Small organic molecules, restricted to named common space groups, CSP2001 workshop", "evidence": "'two correct predictions for the first molecule, four for the second molecule and none for the third molecule (which had torsional flexibility)'", "generality": "single-study", "type": "statistic", "title": "Crystal structure prediction of small organic molecules: a second blind test", "year": 2002, "url": "https://doi.org/10.1107/s0108768102005669"}, "blind-test-2:1": {"statement": "The correct structure frequently appears in the sorted low-energy list but at a rank beyond the top three, so lattice-energy ranking alone often fails to place the true polymorph at the top.", "scope": "Lattice-energy-ranked CSP of small organics, CSP2001", "evidence": "'The correct structure was often present in the sorted low-energy lists from the participants but at a ranking position greater than three.'", "generality": "single-study", "type": "pitfall", "title": "Crystal structure prediction of small organic molecules: a second blind test", "year": 2002, "url": "https://doi.org/10.1107/s0108768102005669"}, "blind-test-2:2": {"statement": "Molecular flexibility (torsional degrees of freedom) sharply degrades CSP success, since conformational freedom expands the search space and complicates energy ranking.", "scope": "Flexible vs rigid small organic molecules", "evidence": "Molecule 3, described as having torsional flexibility, received zero correct predictions vs 2-4 for the others.", "generality": "suggested", "type": "principle", "title": "Crystal structure prediction of small organic molecules: a second blind test", "year": 2002, "url": "https://doi.org/10.1107/s0108768102005669"}, "blind-test-2:3": {"statement": "The standard CSP methodology builds theoretical crystal structures from a molecular model within specified space groups and predicts based on minimum calculated lattice energy, allowing a small number (three) of ranked submissions.", "scope": "Circa-2001 CSP programs for small organics", "evidence": "'a molecular model is used to construct theoretical crystal structures in given space groups, and prediction is usually based on the minimum calculated lattice energy. A maximum of three predictions were allowed per molecule.'", "generality": "established", "type": "pipeline_practice", "title": "Crystal structure prediction of small organic molecules: a second blind test", "year": 2002, "url": "https://doi.org/10.1107/s0108768102005669"}, "blind-test-2:4": {"statement": "Non-indexed powder diffraction data can be brought in as a secondary discriminator to select among candidate structures when pure ab initio energy ranking is insufficient.", "scope": "CSP post-processing when experimental powder data is available", "evidence": "'The use of non-indexed powder diffraction data was investigated in a secondary test, after completion of the ab initio submissions.'", "generality": "single-study", "type": "decision_rule", "title": "Crystal structure prediction of small organic molecules: a second blind test", "year": 2002, "url": "https://doi.org/10.1107/s0108768102005669"}, "blind-test-2:5": {"statement": "No single CSP method is completely reliable; the blind test provides an objective measure of both successes and failures of current methodologies.", "scope": "CSP methods for small organic molecules as of 2001", "evidence": "'Although no one method can be said to be completely reliable, this workshop gives an objective measure of the success and failure of current methodologies.'", "generality": "established", "type": "principle", "title": "Crystal structure prediction of small organic molecules: a second blind test", "year": 2002, "url": "https://doi.org/10.1107/s0108768102005669"}, "blind-test-3:0": {"statement": "In CSP2004, out of three blind target molecules and three allowed predictions each, only one target was correctly predicted, a lower success rate than the two prior blind tests.", "scope": "CSP blind test 2004; small rigid + flexible molecules; 18 participating groups", "evidence": "'Success rates within the three submitted predictions were lower than in the previous tests - there was only one successful prediction for any of the three blind molecules.'", "generality": "single-study", "type": "statistic", "title": "A third blind test of crystal structure prediction", "year": 2005, "url": "https://doi.org/10.1107/s0108768105016563"}, "blind-test-3:1": {"statement": "Most CSP methods share a common core: global minimization of the lattice energy to rank likely structures, so ranking quality is bounded by the accuracy of the energy model.", "scope": "CSP methodologies circa 2004", "evidence": "'A range of methodologies... although most are based on the global minimization of the lattice energy.'", "generality": "established", "type": "principle", "title": "A third blind test of crystal structure prediction", "year": 2005, "url": "https://doi.org/10.1107/s0108768105016563"}, "blind-test-3:2": {"statement": "A molecule that appears 'simplest' (small, rigid, common atoms) can still defeat prediction if the real crystal has more than one molecule in the asymmetric unit (Z'>1).", "scope": "small rigid organic molecule that crystallized with Z'=2", "evidence": "'For the simplest rigid molecule, this lack of success is partly due to the observed structure crystallizing with two molecules in the asymmetric unit.'", "generality": "single-study", "type": "pitfall", "title": "A third blind test of crystal structure prediction", "year": 2005, "url": "https://doi.org/10.1107/s0108768105016563"}, "blind-test-3:3": {"statement": "Flexible molecules remained unpredicted, repeating the failure of the previous blind test, because energy models struggle to describe conformational and packing energies simultaneously.", "scope": "conformationally flexible target molecule; blind tests 2001 and 2004", "evidence": "'As in the 2001 blind test, there was no success in predicting the structure of the flexible molecule... necessity for better energy models, capable of simultaneously describing conformational and packing energies with high accuracy.'", "generality": "suggested", "type": "pitfall", "title": "A third blind test of crystal structure prediction", "year": 2005, "url": "https://doi.org/10.1107/s0108768105016563"}, "blind-test-3:4": {"statement": "Search procedures need explicit extension to handle Z'>1 crystals and conformational flexibility; treating these as afterthoughts leaves known thermodynamically favored polymorphs unreachable.", "scope": "lattice-energy-minimization CSP workflows", "evidence": "'need for improvements in search procedures for crystals with more than one independent molecule, as well as for molecules with conformational flexibility.'", "generality": "suggested", "type": "decision_rule", "title": "A third blind test of crystal structure prediction", "year": 2005, "url": "https://doi.org/10.1107/s0108768105016563"}, "blind-test-3:5": {"statement": "Even a perfect thermodynamic ranking cannot fully predict observed polymorphs, because nucleation and crystal growth kinetics determine which low-energy structures actually form.", "scope": "molecular crystal polymorphism generally", "evidence": "'Which of these are actually realised is also influenced by as yet insufficiently understood processes of nucleation and crystal growth.'", "generality": "established", "type": "principle", "title": "A third blind test of crystal structure prediction", "year": 2005, "url": "https://doi.org/10.1107/s0108768105016563"}, "blind-test-3:6": {"statement": "The blind test protocol gives participants only 2D molecular diagrams and requires three ranked candidate structures per target, with the true structure withheld until submission.", "scope": "CCDC CSP blind test format 2004", "evidence": "'the participants were given molecular diagrams of three molecules and asked to submit three predictions for the most likely crystal structure of each.'", "generality": "established", "type": "pipeline_practice", "title": "A third blind test of crystal structure prediction", "year": 2005, "url": "https://doi.org/10.1107/s0108768105016563"}, "blind-test-4:0": {"statement": "In the fourth blind test, 14 groups tackled four targets; there were 13 successful predictions overall, with at least two groups correctly predicting each of the four target structures.", "scope": "Small, fairly rigid organic molecules; three single-component crystals and one 1:1 cocrystal; three allowed predictions per target.", "evidence": "'14 research groups which took part... four target systems: three single-component crystal structures and a 1:1 cocrystal... in total, there were 13 successful predictions and, for each of the four targets, at least two groups correctly predicted the observed crystal structure.'", "generality": "established", "type": "statistic", "title": "Significant progress in predicting the crystal structures of small organic molecules \u2013 a report on the fourth blind test", "year": 2009, "url": "https://doi.org/10.1107/s0108768109004066"}, "blind-test-4:1": {"statement": "CSP success rates improved dramatically between the third and fourth blind tests, attributed to important improvements in modelling (generation and ranking) methods.", "scope": "Small, fairly rigid or
