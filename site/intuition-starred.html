ganic molecules as of 2009.", "evidence": "'The results demonstrate a dramatic improvement in rates of success over previous blind tests... The results reflect important improvements in modelling methods.'", "generality": "established", "type": "principle", "title": "Significant progress in predicting the crystal structures of small organic molecules \u2013 a report on the fourth blind test", "year": 2009, "url": "https://doi.org/10.1107/s0108768109004066"}, "blind-test-4:2": {"statement": "For small and fairly rigid molecules, CSP calculations are reliable enough to constructively help understand crystallization and polymorphism; results should not be extrapolated to larger or more flexible molecules.", "scope": "Small, fairly rigid organic molecules only, as demonstrated in the 2009 blind test.", "evidence": "'at least for the small and fairly rigid types of molecules included in this blind test, such calculations can be constructively applied to help understand crystallization and polymorphism.'", "generality": "established", "type": "decision_rule", "title": "Significant progress in predicting the crystal structures of small organic molecules \u2013 a report on the fourth blind test", "year": 2009, "url": "https://doi.org/10.1107/s0108768109004066"}, "blind-test-4:3": {"statement": "Top-ranked CSP success can come at considerable computational expense; getting the observed structure as the first ranked choice may require methods too costly for routine application.", "scope": "Blind test conditions; the one group that correctly ranked all four targets first.", "evidence": "'one participating group who correctly predicted all four crystal structures as their first ranked choice, albeit at a considerable computational expense.'", "generality": "single-study", "type": "pitfall", "title": "Significant progress in predicting the crystal structures of small organic molecules \u2013 a report on the fourth blind test", "year": 2009, "url": "https://doi.org/10.1107/s0108768109004066"}, "blind-test-4:4": {"statement": "The blind test protocol gives participants only molecular diagrams, withholds the experimentally determined (unpublished) structures via an independent referee, and allows three ranked predictions per target - a two-stage generate-then-rank challenge.", "scope": "CSP blind test methodology, fourth test (2009).", "evidence": "'Participants were challenged to predict the crystal structures... given only their molecular diagrams, while the recently determined but as-yet unpublished crystal structures were withheld by an independent referee. Three predictions were allowed for each system.'", "generality": "established", "type": "pipeline_practice", "title": "Significant progress in predicting the crystal structures of small organic molecules \u2013 a report on the fourth blind test", "year": 2009, "url": "https://doi.org/10.1107/s0108768109004066"}, "ts-vdw-2009:0": {"statement": "The TS method reproduces intermolecular C6 coefficients with a mean absolute relative error of 5.5% (4.5% if H2 is excluded) against 1225 experimental DOSD-derived pairs, a factor of 2-3 better than prior ground-state-density C6 methods (which had 15-20% average, 40-60% max errors).", "scope": "8 atoms and 42 small-to-medium organic/inorganic molecules (up to C8H18), Z'=1 gas-phase geometries", "evidence": "'mean absolute error in the C6 coefficients is 5.5%... for 1225 intermolecular pairs'; 'if the H2 molecule is excluded... the MARE drops down to 4.5%'; existing methods errors '15%-20% on average and maximum deviation of 40%-60%'", "generality": "established", "type": "statistic", "title": "Accurate Molecular Van Der Waals Interactions from Ground-State Electron Density and Free-Atom Reference Data", "year": 2009, "url": "https://doi.org/10.1103/physrevlett.102.073005"}, "ts-vdw-2009:1": {"statement": "Effective atomic C6 coefficients depend strongly on an atom's bonding environment; using the ground-state density to rescale free-atom polarizabilities automatically captures hybridization state and charge polarization (e.g. carbon C6 ranges 24-33, matching sp3-methane vs sp2-benzene expectations).", "scope": "Light main-group atoms (C, N, O, H, Si, S, Cl, F) in molecules and simple solids", "evidence": "atom-in-molecule C6 for C ranges 24.1-33.0 vs free-atom 46.6, matching Wu-Yang 22.1-29.8; graphene C=33.0 (near benzene sp2 30.3), diamond C=38.6 vs methane sp3 24.1", "generality": "established", "type": "principle", "title": "Accurate Molecular Van Der Waals Interactions from Ground-State Electron Density and Free-Atom Reference Data", "year": 2009, "url": "https://doi.org/10.1103/physrevlett.102.073005"}, "ts-vdw-2009:2": {"statement": "Computing C6 from the RATIO of effective to free-atom Hirshfeld volumes makes the result nearly independent of the exchange-correlation functional, because density differences between functionals cancel in the ratio.", "scope": "LDA, PBE, BLYP tested on the molecular database", "evidence": "MARE in C6 between LDA and PBE is 1.4% (max 3.8%), BLYP vs PBE 0.68% (max 2.1%); 'difference in the electron density between xc functionals is compensated when computing the ratio'", "generality": "established", "type": "principle", "title": "Accurate Molecular Van Der Waals Interactions from Ground-State Electron Density and Free-Atom Reference Data", "year": 2009, "url": "https://doi.org/10.1103/physrevlett.102.073005"}, "ts-vdw-2009:3": {"statement": "The assumption that the polarizability-to-volume proportionality constant is unchanged from free atom to atom-in-molecule (set to unity) is excellent for most molecules but breaks down for very small systems, especially H2.", "scope": "Small molecules; H2 is the worst case", "evidence": "'this approximation breaks down only for the smallest H2 molecule, with deviation of 44%'; already for N2 and CO2 error < 10%", "generality": "single-study", "type": "decision_rule", "title": "Accurate Molecular Van Der Waals Interactions from Ground-State Electron Density and Free-Atom Reference Data", "year": 2009, "url": "https://doi.org/10.1103/physrevlett.102.073005"}, "ts-vdw-2009:4": {"statement": "Pairwise C6/R6 summation neglects nonadditive many-body/higher-order effects and can fail qualitatively for metallic low-dimensional systems; the atoms-in-molecules concept itself breaks where atomic partitioning is ill-defined.", "scope": "Metallic low-dimensional systems and cases where atoms-in-molecules cannot be applied", "evidence": "'a pairwise summation of C6R6 interactions can fail qualitatively for metallic low-dimensional systems due to nonadditive higher-order effects'", "generality": "established", "type": "pitfall", "title": "Accurate Molecular Van Der Waals Interactions from Ground-State Electron Density and Free-Atom Reference Data", "year": 2009, "url": "https://doi.org/10.1103/physrevlett.102.073005"}, "ts-vdw-2009:5": {"statement": "To couple the long-range dispersion to DFT one needs a short-range damping function with vdW radii scaled by the effective volume; the recommended Fermi damping steepness d=20 works for 12<d<45 (small d corrupts covalent bonds, large d gives kinked curves), leaving one system-specific scaling parameter sR (0.94 for PBE) fit to the S22 CCSD(T) benchmark.", "scope": "CNOH light elements; PBE functional benchmarked on S22 dimers (23 meV CH4 to 0.9 eV uracil)", "evidence": "'choice of d=20 turned out to satisfy both constraints'; 'sR... single empirical parameter'; 'sR coefficient for PBE is 0.94'", "generality": "single-study", "type": "pipeline_practice", "title": "Accurate Molecular Van Der Waals Interactions from Ground-State Electron Density and Free-Atom Reference Data", "year": 2009, "url": "https://doi.org/10.1103/physrevlett.102.073005"}, "ts-vdw-2009:6": {"statement": "TS+PBE gives a mean absolute error of 13 meV on the S22 benchmark (20/13/6 meV for H-bonded/vdW/mixed), versus 20 meV (29/20/9) for empirical C6+vdW-radii schemes; the improvement in H-bonded systems comes from larger effective vdW radii for atoms in hydrogen bonds.", "scope": "S22 database of 22 noncovalent dimers, PBE functional", "evidence": "'MAE of our approach on the S22 database is 13 meV (20, 13, and 6 meV...)... compared to 20 meV (29, 20, and 9 meV) when using empirical C6 coefficients'", "generality": "single-study", "type": "statistic", "title": "Accurate Molecular Van Der Waals Interactions from Ground-State Electron Density and Free-Atom Reference Data", "year": 2009, "url": "https://doi.org/10.1103/physrevlett.102.073005"}, "ts-vdw-2009:7": {"statement": "Hydrogen bonding measurably redistributes polarizability: the donor H and donor O become more polarizable while the acceptor O and its H become less polarizable, and this is a purely electronic effect visible at fixed geometry.", "scope": "Water dimer as illustrative case", "evidence": "'hydrogen involved in the hydrogen bond becomes significantly more polarizable along with the donor oxygen... acceptor oxygen becomes less polarizable'; 'change in the C6 coefficients is a purely electronic effect' at fixed geometry", "generality": "single-study", "type": "principle", "title": "Accurate Molecular Van Der Waals Interactions from Ground-State Electron Density and Free-Atom Reference Data", "year": 2009, "url": "https://doi.org/10.1103/physrevlett.102.073005"}, "mbd-2012:0": {"statement": "Pairwise-additive dispersion overestimates polarizability and C6 in large/extended systems because it ignores long-range electrostatic screening (depolarization) from distant fluctuating dipoles; self-consistent screening corrects this.", "scope": "Finite-gap molecules, hydrogen-saturated Si clusters, and bulk Si", "evidence": "TS-vdW C6 error grows with cluster size to 27% for Si172H120 and 68% overestimation for Si bulk C6; adding SCS gives depolarization reducing bulk error to just 8%.", "generality": "single-study", "type": "principle", "title": "Accurate and Efficient Method for Many-Body van der Waals Interactions", "year": 2012, "url": "https://doi.org/10.1103/physrevlett.108.236402"}, "mbd-2012:1": {"statement": "Many-body/screening corrections shift molecular-crystal cohesive energies by well over 100 meV/molecule, turning a large overbinding into near-experimental agreement.", "scope": "Benzene molecular crystal at experimental geometry, PBE-based", "evidence": "PBE+TS-vdW gives 690 meV/molecule vs experiment 518-560 meV/molecule; PBE+MBD yields 565 meV/molecule.", "generality": "single-study", "type": "statistic", "title": "Accurate and Efficient Method for Many-Body van der Waals Interactions", "year": 2012, "url": "https://doi.org/10.1103/physrevlett.108.236402"}, "mbd-2012:2": {"statement": "MBD substantially improves intermolecular binding energies over pairwise TS-vdW on standard benchmarks.", "scope": "S22 intermolecular database, binding energies 23-895 meV, vs CCSD(T) basis-set limit", "evidence": "MARE decreased from 9.2% (PBE+TS-vdW) to 5.4% (PBE+MBD); vdW-bound subset MARE reduced by ~10%.", "generality": "single-study", "type": "statistic", "title": "Accurate and Efficient Method for Many-Body van der Waals Interactions", "year": 2012, "url": "https://doi.org/10.1103/physrevlett.108.236402"}, "mbd-2012:3": {"statement": "Many-body dispersion can flip conformational rankings: pairwise dispersion may predict the wrong most-stable conformer.", "scope": "27 conformers of alanine tetrapeptide (Ace-Ala3-NMe), PBE0-based, vs CCSD(T)", "evidence": "PBE0+TS-vdW MAE 0.52 kcal/mol but predicts wrong most-stable conformer and wrong hierarchy; PBE0+MBD MAE 0.29 kcal/mol, correct most-stable conformer; differences reach ~1 kcal/mol.", "generality": "single-study", "type": "statistic", "title": "Accurate and Efficient Method for Many-Body van der Waals Interactions", "year": 2012, "url": "https://doi.org/10.1103/physrevlett.108.236402"}, "mbd-2012:4": {"statement": "The screened many-body vdW energy is obtained as the difference of zero-point energies between coupled and uncoupled oscillators, and this coupled-oscillator model can be derived as an approximation to the exact ACFDT correlation energy.", "scope": "Systems where the polarizability is even in frequency with simple poles on/below the real axis", "evidence": "EvdW = (1/2)sum sqrt(lambda_p) - (3/2)sum omega_p; derivable from ACFDT since correlation energy equals difference of zero-point energies under those pole conditions.", "generality": "established", "type": "principle", "title": "Accurate and Efficient Method for Many-Body van der Waals Interactions", "year": 2012, "url": "https://doi.org/10.1103/physrevlett.108.236402"}, "mbd-2012:5": {"statement": "Anisotropy in molecular polarizability comes largely from long-range dipole field screening, not just atomic partitioning; screening becomes less important for integrated C6 because response grows isotropic at high imaginary frequency.", "scope": "17 small molecules H2 to cyclohexane, N2 example", "evidence": "TS-vdW fractional anisotropy error 80%, reduced to 23% with SCS; TS-vdW C6 error (5.5%) far better than static polarizability error (~12%) because response isotropizes at large i-omega.", "generality": "suggested", "type": "principle", "title": "Accurate and Efficient Method for Many-Body van der Waals Interactions", "year": 2012, "url": "https://doi.org/10.1103/physrevlett.108.236402"}, "mbd-2012:6": {"statement": "Couple the many-body dispersion to the DFT functional through a range-separated (damped) Coulomb potential rather than ad hoc pairwise damping functions, fitting one beta parameter per functional.", "scope": "DFA+MBD with GGA/hybrid functionals; beta>=2 so potential vanishes at zero distance", "evidence": "beta=2.56 for PBE, 2.53 for PBE0, fit to S22; vdW radius R_vdW_p = (alpha_SCS/alpha_free)^(1/3) R_vdW,free from coupled-cluster free-atom reference.", "generality": "single-study", "type": "decision_rule", "title": "Accurate and Efficient Method for Many-Body van der Waals Interactions", "year": 2012, "url": "https://doi.org/10.1103/physrevlett.108.236402"}, "mbd-2012:7": {"statement": "MBD workflow: partition density into atoms (Hirshfeld), build TS effective atomic polarizabilities, solve SCS for screened static polarizability and characteristic frequency, then diagonalize the 3Nx3N coupled-oscillator matrix for the vdW energy.", "scope": "Finite-gap molecules and condensed matter, atoms modeled as Gaussian QHOs", "evidence": "SCS omega defined to reproduce C6_SCS from Casimir-Polder integral; MBD energy for 1000 atoms takes ~3 min on a single processor (DFT not included).", "generality": "established", "type": "pipeline_practice", "title": "Accurate and Efficient Method for Many-Body van der Waals Interactions", "year": 2012, "url": "https://doi.org/10.1103/physrevlett.108.236402"}, "mbd-2012:8": {"statement": "Truncating many-body vdW at three-body Axilrod-Teller can give even the wrong sign for the many-body vdW energy.", "scope": "General many-body dispersion beyond pairwise", "evidence": "Stated that three-body Axilrod-Teller treatment 'might even give the wrong sign for the many-body vdW energy'.", "generality": "established", "type": "pitfall", "title": "Accurate and Efficient Method for Many-Body van der Waals Interactions", "year": 2012, "url": "https://doi.org/10.1103/physrevlett.108.236402"}, "aspirin-anharmonicity-2014:0": {"statement": "The two observed aspirin polymorphs are essentially degenerate in lattice energy, with 0 K differences of order 0.1 kJ/mol; MBD gives +0.04 kJ/mol, TS gives -0.18 kJ/mol, and PBE0+MBD differs from PBE+MBD by only 0.1 kJ/mol.", "scope": "Aspirin forms I and II, static 0 K DFT lattice energies with pairwise (TS) and many-body (MBD) dispersion", "evidence": "Table I: PBE+TS -0.18, PBE+MBD 0.04 kJ/mol; text: 'very small energy differences of the order of 0.1 kJ/mol... essentially degenerate'; 'PBE0+MBD... differing by only 0.1 kJ/mol'", "generality": "single-study", "type": "statistic", "title": "Role of Dispersion Interactions in the Polymorphism and Entropic Stabilization of the Aspirin Crystal", "year": 2014, "url": "https://doi.org/10.1103/physrevlett.113.055701"}, "aspirin-anharmonicity-2014:1": {"statement": "Zero-point energy corrections to the polymorph energy difference are small (0.2-0.3 kJ/mol, consistent with a prior 0.4 kJ/mol), but the finite-temperature vibrational free-energy contribution at 298 K is large and method-dependent: PBE+MBD gives a +2.56 kJ/mol preference for form I while PBE+TS gives a -0.68 kJ/mol preference for form II.", "scope": "Aspirin forms I/II, harmonic free energies at 298 K, PBE+TS vs PBE+MBD", "evidence": "Table I: PBE+MBD+Fvib(298 K) 2.56, PBE+TS+Fvib(298 K) -0.68 kJ/mol; ZPE 0.2-0.3 kJ/mol", "generality": "single-study", "type": "statistic", "title": "Role of Dispersion Interactions in the Polymorphism and Entropic Stabilization of the Aspirin Crystal", "year": 2014, "url": "https://doi.org/10.1103/physrevlett.113.055701"}, "aspirin-anharmonicity-2014:2": {"statement": "Many-body dispersion couples collective electronic (plasmon-like) excitations to lattice phonons: although plasmon energies (~8 eV) are ~1000x larger than phonon energies (tens of meV), the change in vdW energy along phonon motions is several meV, enough to renormalize and soften low-frequency phonons. Geometry-dependent static polarizability drives this renormalization while atomic reference frequencies stay fixed.", "scope": "Molecular crystals with soft low-frequency lattice/librational modes; demonstrated for aspirin via the MBD Hamiltonian", "evidence": "MBD energy Eq (2); 'change of the vdW energy associated to characteristic phonon motions... on the order of several meV, making plasmon-phonon coupling possible'; MBD introduces four modes at 28-34 cm-1 absent in pure PBE", "generality": "single-study", "type": "principle", "title": "Role of Dispersion Interactions in the Polymorphism and Entropic Stabilization of the Aspirin Crystal", "year": 2014, "url": "https://doi.org/10.1103/physrevlett.113.055701"}, "aspirin-anharmonicity-2014:3": {"statement": "Lower-frequency phonon modes are more easily thermally populated, so a polymorph with softer lattice vibrations has higher vibrational entropy and lower free energy. Entropic stabilization can flip a ranking that lattice energy alone leaves ambiguous.", "scope": "Nearly lattice-energy-degenerate polymorphs at finite temperature (harmonic free energy)", "evidence": "'lower-frequency vibrations of form I are more easily thermally populated, increasing its entropy and ultimately leading to a lower free energy'", "generality": "suggested", "type": "principle", "title": "Role of Dispersion Interactions in the Polymorphism and Entropic Stabilization of the Aspirin Crystal", "year": 2014, "url": "https://doi.org/10.1103/physrevlett.113.055701"}, "aspirin-anharmonicity-2014:4": {"statement": "When candidate polymorphs are near-degenerate in lattice energy, compute finite-temperature free energies including phonons treated with the same dispersion model used for the energy; pairwise vs many-body dispersion can give qualitatively opposite rankings, so the vibrational treatment must be dispersion-consistent.", "scope": "Ranking near-degenerate molecular crystal polymorphs where thermal effects may dominate", "evidence": "PBE+TS predicts form II stable, PBE+MBD predicts form I stable by 2.56 kJ/mol; 'majority of the PBE+MBD free-energy difference arises from thermal vibrational contributions'", "generality": "single-study", "type": "decision_rule", "title": "Role of Dispersion Interactions in the Polymorphism and Entropic Stabilization of the Aspirin Crystal", "year": 2014, "url": "https://doi.org/10.1103/physrevlett.113.055701"}, "aspirin-anharmonicity-2014:5": {"statement": "Pairwise dispersion (TS) can misplace internal degrees of freedom that couple to phonons: TS gave a methyl torsion of 47.1 deg while MBD gave 60.1 deg, matching the 20 K neutron value of 58.2 deg. Wrong geometry propagates into wrong vibrational spectra and thus wrong free-energy rankings.", "scope": "Molecular crystals with flexible/rotatable groups (methyl torsions) sensitive to dispersion model", "evidence": "PBE+TS torsion 47.1 deg vs PBE+MBD 60.1 deg vs neutron 58.2 deg at 20 K; similar >10 deg difference for form II", "generality": "single-study", "type": "pitfall", "title": "Role of Dispersion Interactions in the Polymorphism and Entropic Stabilization of the Aspirin Crystal", "year": 2014, "url": "https://doi.org/10.1103/physrevlett.113.055701"}, "aspirin-anharmonicity-2014:6": {"statement": "Directional elastic measurements can mislead about relative stability: nanoindentation suggested form II is 'considerably softer' and mechanically unstable, but full Young's-modulus analysis showed form II is only softer along some directions and much stiffer in the e1e3 plane (transverse to its stronger hydrogen bonds), which the experiments never probed. Both forms satisfy the Born stability criterion.", "scope": "Elastic/mechanical stability assessment of molecular crystal polymorphs", "evidence": "Fig 4; 'nanoindentation experiments did not probe along this hard direction'; lambda_min = 2.60 GPa (form I), 1.86 GPa (form II), both positive; exp lambda_min 2.40 GPa at 300 K", "generality": "single-study", "type": "pitfall", "title": "Role of Dispersion Interactions in the Polymorphism and Entropic Stabilization of the Aspirin Crystal", "year": 2014, "url": "https://doi.org/10.1103/physrevlett.113.055701"}, "aspirin-anharmonicity-2014:7": {"statement": "Dispersion treatment strongly affects computed elastic moduli: MBD reduces bulk modulus by over 20% vs TS (form I bulk 12.40 -> 9.58 GPa; exp 7.77 GPa), and even flips the qualitative ordering of the shear modulus (TS: form I 5.08 > form II 4.33; MBD: form I 4.00 < form II 4.67 GPa).", "scope": "Aspirin forms I/II elastic constants, PBE+TS vs PBE+MBD vs 300 K experiment", "evidence": "Table II: bulk moduli and shear moduli listed; 'MBD reduces the bulk modulus by over 20% compared to TS'", "generality": "single-study", "type": "statistic", "title": "Role of Dispersion Interactions in the Polymorphism and Entropic Stabilization of the Aspirin Crystal", "year": 2014, "url": "https://doi.org/10.1103/physrevlett.113.055701"}};
window.renderStars=function(){
  const ids=(JSON.parse(localStorage.getItem('intuition_starred')||'[]')).filter(c=>DATA[c]);
  const list=document.getElementById('starlist');list.innerHTML='';
  ids.forEach(cid=>{const d=DATA[cid];const div=document.createElement('div');
    div.className='chunk';div.dataset.cid=cid;
    div.innerHTML=`<span class="cstar" title="Unstar">&#9733;</span>`+
      `<div class="stmt"></div><div class="meta"></div><div class="ev"></div><div class="src"></div>`;
    div.querySelector('.stmt').textContent=d.statement;
    div.querySelector('.meta').textContent=`${d.type} · scope: ${d.scope} · ${d.generality}`;
    div.querySelector('.ev').textContent=d.evidence;
    div.querySelector('.src').innerHTML=d.url?`source: <a href="${d.url}" target="_blank"></a>`:'source: ';
    const a=div.querySelector('.src a')||div.querySelector('.src');
    a.textContent=`${d.title} (${d.year||''})`;
    list.appendChild(div);});
  document.getElementById('emptymsg').style.display=ids.length?'none':'block';
};
document.getElementById('copystars').addEventListener('click',ev=>{
  const md=(JSON.parse(localStorage.getItem('intuition_starred')||'[]')).filter(c=>DATA[c]).map(c=>{const d=DATA[c];
    return `- **${d.statement}**\n    - scope: ${d.scope} | generality: ${d.generality}\n    - evidence: ${d.evidence}\n    - source: [${d.title} (${d.year||''})](${d.url})`;
  }).join('\n');
  navigator.clipboard.writeText(md).then(()=>{ev.target.textContent='Copied!';setTimeout(()=>ev.target.textContent='Copy as Markdown',1500);});
});
</script>
<script>
const KEY='intuition_starred';
const get=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}};
const save=a=>localStorage.setItem(KEY,JSON.stringify(a));
function paint(){
  const s=new Set(get());
  document.querySelectorAll('.chunk[data-cid]').forEach(el=>{
    const b=el.querySelector('.cstar');
    if(b){const on=s.has(el.dataset.cid);b.innerHTML=on?'&#9733;':'&#9734;';b.classList.toggle('on',on);}
  });
  const n=document.getElementById('navstarn');if(n)n.textContent=get().length;
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('.cstar');if(!b)return;
  const cid=b.closest('.chunk').dataset.cid;let a=get();
  a=a.includes(cid)?a.filter(x=>x!==cid):[...a,cid];save(a);paint();
  if(window.renderStars)window.renderStars();
});
paint();if(window.renderStars)window.renderStars();
</script></div></body></html>
